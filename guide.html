### 11.2.3 환경 관리

프로젝트마다 필요한 Python 버전과 라이브러리 버전이 다르다. 환경 관리 도구 없이 `pip install`을 전역으로 하면 프로젝트 A에 필요한 라이브러리가 프로젝트 B와 충돌하는 "의존성 지옥(dependency hell)"에 빠진다. Conda나 venv로 프로젝트별 독립 환경을 만드는 것이 기본이다.

**Conda** (권장):

```bash
# Miniconda 설치
wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
bash Miniconda3-latest-Linux-x86_64.sh

# 환경 생성
conda create -n myenv python=3.10
conda activate myenv

# 패키지 설치
conda install pytorch torchvision pytorch-cuda=12.1 -c pytorch -c nvidia
```

**venv** (가벼움):

```bash
python3 -m venv myenv
source myenv/bin/activate
pip install -r requirements.txt
```

예를 들어 SLAM 연구에는 Python 3.8이 필요하고, 최신 트랜스포머 모델에는 Python 3.10이 필요할 수 있다. Conda를 쓰면 `conda activate slam_env`, `conda activate transformer_env`로 전환하면 끝이다.

> **추천 자료**
> - [Conda Documentation - Managing Environments](https://docs.conda.io/projects/conda/en/latest/user-guide/tasks/manage-environments.html) — Conda 환경 관리 공식 가이드
> - [Python venv Documentation](https://docs.python.org/3/library/venv.html) — 파이썬 공식 가상환경 문서

### 11.3 Docker

### 11.3.1 왜 Docker인가?

연구실에서 코드를 공유할 때 가장 많이 듣는 말이 "내 컴퓨터에선 돌아가는데..."이다. Docker는 그 문제를 해결한다. OS, 라이브러리, 환경 설정을 통째로 패키징해서 어디서든 동일한 실행 환경을 보장하기 때문이다. 논문 코드를 재현할 때도 Docker 이미지가 제공되면 훨씬 수월하다.

- **재현성**: 동일한 환경 보장
- **격리**: 시스템 오염 방지
- **배포**: 쉬운 공유 및 배포
- **의존성**: 복잡한 의존성 관리

### 11.3.2 기본 사용법

```bash
# 이미지 다운로드
docker pull nvidia/cuda:12.1.0-devel-ubuntu22.04

# 컨테이너 실행
docker run -it --rm \
    --gpus all \
    -v $(pwd):/workspace \
    nvidia/cuda:12.1.0-devel-ubuntu22.04 bash

# Dockerfile 빌드
docker build -t my_image .
```

**Dockerfile 예시**:

```docker
FROM nvidia/cuda:12.1.0-devel-ubuntu22.04

RUN apt-get update && apt-get install -y \
    python3-pip git

COPY requirements.txt /tmp/
RUN pip3 install -r /tmp/requirements.txt

WORKDIR /workspace
```

> **추천 자료**
> - [Docker 공식 Getting Started Guide](https://docs.docker.com/get-started/) — Docker 처음이라면 여기부터. 컨테이너, 이미지, 볼륨 개념을 잘 설명
> - [NetworkChuck - Docker Tutorial](https://www.youtube.com/watch?v=eGz9DS-aIeY) — Docker를 재미있고 쉽게 설명하는 영상. 입문에 최고
> - [Fireship - Docker in 100 Seconds](https://www.youtube.com/watch?v=Gjnup-PuquQ) — Docker 핵심 개념을 빠르게 훑어보기

### 11.3.3 NVIDIA Docker

GPU를 컨테이너에서 사용하기 위한 도구이다.

일반 Docker 컨테이너 안에서는 GPU가 보이지 않는다. 딥러닝 학습이나 CUDA 기반 연산을 하려면 nvidia-container-toolkit을 설치하고 `--gpus all` 플래그를 사용해야 한다. 로보틱스 연구에서 Docker를 쓴다면 거의 100% 이것이 필요하다.

```bash
# nvidia-container-toolkit 설치
distribution=$(. /etc/os-release;echo $ID$VERSION_ID)
curl -s -L https://nvidia.github.io/nvidia-docker/gpgkey | sudo apt-key add -
curl -s -L https://nvidia.github.io/nvidia-docker/$distribution/nvidia-docker.list | \
    sudo tee /etc/apt/sources.list.d/nvidia-docker.list
sudo apt-get update && sudo apt-get install -y nvidia-container-toolkit

# 사용
docker run --gpus all nvidia/cuda:12.1.0-base-ubuntu22.04 nvidia-smi
```

> **추천 자료**
> - [NVIDIA Container Toolkit Documentation](https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/index.html) — NVIDIA Docker 공식 설치 및 설정 가이드

> **⚠ AI 에이전트 주의**: AI에게 Docker 설정을 물어볼 때는 "ROS2 + GPU + USB 센서 + GUI 시각화"를 동시에 쓸 건지 알려줘라. 각각을 따로 물어보면 서로 충돌하는 설정을 받게 된다. 한번에 전체 요구사항을 전달해야 한다.

### 11.4 버전 관리: Git/GitHub

### 11.4.1 기본 워크플로우

코드를 관리하지 않으면, "어제 돌아가던 코드가 오늘은 왜 안 되지?"라는 상황이 반복된다. Git은 모든 변경 이력을 추적해 주므로, 언제든 과거 상태로 돌아갈 수 있다. 연구 코드라도 Git으로 관리하는 습관을 들이자.

```bash
# 저장소 클론
git clone https://github.com/user/repo.git

# 변경 사항 확인
git status
git diff

# 커밋
git add .
git commit -m "feat: add new feature"

# 푸시
git push origin main
```

> **추천 자료**
> - [GitHub's Git Handbook](https://docs.github.com/en/get-started/using-git/about-git) — Git 핵심 개념을 깔끔하게 정리한 공식 가이드
> - [The Missing Semester - Version Control (Git)](https://missing.csail.mit.edu/2020/version-control/) — MIT 강의. Git의 내부 모델(DAG)까지 설명해 줘서 깊이 있게 이해 가능

### 11.4.2 브랜치 전략

**Git Flow**:
- `main`: 안정 버전
- `develop`: 개발 버전
- `feature/*`: 기능 개발
- `hotfix/*`: 긴급 수정

**GitHub Flow** (간단):
- `main`: 항상 배포 가능
- `feature-branch`: 기능별 브랜치 → PR → Merge

연구실에서 여러 사람이 같은 코드를 수정할 때 브랜치 전략 없이 `main`에 직접 push하면 충돌이 끊이질 않는다. 연구 코드라면 GitHub Flow 정도면 충분하다. 기능 하나당 브랜치 하나를 만들고, PR을 통해 머지하는 습관을 들이자.

### 11.4.3 협업

**Pull Request (PR)**:
1. Fork 또는 브랜치 생성
2. 변경 사항 커밋
3. PR 생성 및 리뷰 요청
4. 코드 리뷰 후 머지

**커밋 메시지 규칙** (Conventional Commits):

```
feat: 새로운 기능
fix: 버그 수정
docs: 문서 변경
refactor: 리팩토링
test: 테스트 추가/수정
chore: 빌드/설정 변경
```

> **추천 자료**
> - [GitHub's Git Handbook](https://docs.github.com/en/get-started/using-git/about-git) — GitHub에서 직접 만든 Git 입문 가이드
> - [Conventional Commits Specification](https://www.conventionalcommits.org/) — 커밋 메시지 규칙 공식 스펙

### 11.5 실험 관리

### 11.5.1 Weights & Biases (wandb)

딥러닝 실험을 하다 보면 "어제 돌린 모델의 하이퍼파라미터가 뭐였지?"라는 상황이 매일 발생한다. 실험 관리 도구 없이 엑셀이나 노트로 기록하면 금방 한계에 부딪힌다. wandb는 학습 과정을 자동으로 로깅하고 시각화해 주며, 팀원과 결과를 공유하기도 쉽다.

**특징**:
- 실험 로깅 및 시각화
- 하이퍼파라미터 추적
- 모델 버전 관리
- 팀 협업

```python
import wandb

# 초기화
wandb.init(project="my-project", config={
    "learning_rate": 0.001,
    "epochs": 100
})

# 로깅
for epoch in range(epochs):
    loss = train_one_epoch()
    wandb.log({"loss": loss, "epoch": epoch})

# 완료
wandb.finish()
```

> **추천 자료**
> - [Weights & Biases 공식 문서 및 Quickstart](https://docs.wandb.ai/quickstart) — wandb 시작 가이드. 5분이면 첫 실험 로깅 가능
> - [Weights & Biases YouTube](https://www.youtube.com/@WeightsBiases) — 사용법 튜토리얼 및 MLOps 관련 강연

### 11.5.2 MLflow

오픈소스 실험 관리 플랫폼이다.

wandb가 클라우드 기반 서비스라면, MLflow는 자체 서버에서 운영할 수 있는 오픈소스 대안이다. 데이터 보안이 중요한 환경에서 유용하다.

```python
import mlflow

mlflow.set_experiment("my-experiment")

with mlflow.start_run():
    mlflow.log_param("lr", 0.001)
    mlflow.log_metric("accuracy", 0.95)
    mlflow.pytorch.log_model(model, "model")
```

### 11.5.3 TensorBoard

```python
from torch.utils.tensorboard import SummaryWriter

writer = SummaryWriter("runs/experiment1")
writer.add_scalar("Loss/train", loss, epoch)
writer.add_image("Sample", image, epoch)
writer.close()
```

```bash
tensorboard --logdir runs
```

TensorBoard는 PyTorch에서도 바로 쓸 수 있고, 별도의 계정 생성 없이 로컬에서 바로 시각화가 가능하다는 장점이 있다. 간단한 실험이라면 wandb 대신 TensorBoard만으로도 충분하다.

## 12. 데이터셋 & 벤치마크

로보틱스와 컴퓨터 비전 연구에서 데이터셋은 알고리즘만큼 중요하다. 좋은 데이터 없이는 좋은 모델을 만들 수 없고, 공정한 벤치마크 없이는 논문에서 자기 방법이 진짜 좋은지 증명할 수 없다. 이 챕터에서는 주요 데이터셋의 구성과 특징, 그리고 자체 데이터를 수집·관리하는 방법까지 다룬다.

최근 트렌드로, **합성 데이터(Synthetic Data)**의 중요성이 급격히 커지고 있다. 실제 데이터를 수집하고 라벨링하는 것은 비용이 많이 들고 시간이 오래 걸리는데, 시뮬레이터에서 자동으로 생성한 합성 데이터로 사전학습하고 소량의 실제 데이터로 미세조정(fine-tuning)하는 방식이 점점 보편화되고 있다. NVIDIA Isaac Sim의 Domain Randomization이나 Habitat의 대규모 장면 생성이 대표적인 예이다. **Sim-to-Real 데이터셋** — 시뮬레이터에서 생성한 데이터와 대응하는 실제 데이터를 쌍으로 제공하는 데이터셋 — 도 활발히 구축되고 있다.

### 12.1 자율주행/로봇 데이터셋

### 12.1.1 KITTI / KITTI360

자율주행 연구의 시작점이 된 오래된 데이터셋이다.

KITTI는 2012년에 공개된 이후 자율주행·3D 비전 연구의 사실상 표준 벤치마크 역할을 해 왔다. 비록 지금은 더 크고 다양한 데이터셋이 있지만, 많은 논문이 여전히 KITTI 결과를 보고하고 있어서 기준점으로 알아 두어야 한다. 특히 Visual Odometry, Stereo Depth Estimation 분야에서는 아직도 KITTI가 1차 벤치마크이다.

**구성**:
- 스테레오 카메라
- 3D LiDAR (Velodyne HDL-64E)
- GPS/IMU
- 2D/3D 라벨

**태스크**:
- Stereo depth estimation
- Optical flow
- Visual odometry / SLAM
- 3D object detection
- Semantic segmentation

**다운로드**: https://www.cvlibs.net/datasets/kitti/

> **추천 자료**
> - [KITTI Benchmark 공식 사이트](https://www.cvlibs.net/datasets/kitti/) — 데이터셋 다운로드 및 각 태스크별 리더보드 확인
> - [KITTI-360 사이트](https://www.cvlibs.net/datasets/kitti-360/) — 더 넓은 범위의 360도 데이터셋

### 12.1.2 nuScenes

대규모 자율주행 데이터셋이다.

KITTI보다 센서 구성이 더 풍부하고(360도 카메라, Radar 포함), 데이터 규모도 훨씬 크다. 최근 자율주행 논문에서 KITTI와 함께 가장 많이 인용되는 데이터셋이다. 특히 3D Object Detection과 BEV(Bird's Eye View) 기반 인식 연구에서 핵심적으로 쓰인다.

**구성**:
- 6개 카메라 (360° 커버)
- 5개 Radar
- 1개 LiDAR
- 1000 장면, 40K 키프레임

**특징**:
- 23개 객체 클래스
- 풍부한 Annotation (속성, 가시성)
- 밤, 비 등 다양한 조건

**평가 메트릭**: mAP, NDS

> **추천 자료**
> - [nuScenes devkit Documentation](https://www.nuscenes.org/nuscenes) — 데이터셋 사용법, devkit API, 튜토리얼 노트북
> - [nuScenes devkit GitHub](https://github.com/nutonomy/nuscenes-devkit) — Python devkit 코드 및 예제

### 12.1.3 Waymo Open Dataset

Google의 대규모 자율주행 데이터셋이다.

nuScenes와 함께 최신 자율주행 연구의 양대 벤치마크이다. 데이터 품질과 규모 면에서 가장 앞서 있으며, 매년 챌린지를 통해 최신 기술 동향을 파악할 수 있다.

**규모**:
- 1,150 장면 (20초)
- 12M LiDAR 라벨
- 12M 카메라 라벨

**특징**:
- 높은 품질의 센서
- 다양한 환경 (도시, 교외, 밤)
- 연간 챌린지 개최

> **추천 자료**

> - [Waymo Open Dataset GitHub](https://github.com/waymo-research/waymo-open-dataset) — 공식 도구 및 예제 코드

### 12.1.4 VIO / VINS용 데이터셋

Visual-Inertial Odometry(VIO)나 SLAM 연구를 한다면 아래 데이터셋은 알아야 한다. 이 분야의 논문이라면 거의 예외 없이 이 데이터셋들에서 평가를 수행한다.

**TUM RGB-D**:
- RGB-D 카메라 시퀀스

- 실내 환경
- Visual SLAM 평가 표준

**EuRoC MAV**:
- 드론 비행 데이터
- 스테레오 + IMU
- VIO 평가 표준

> - [EuRoC MAV Dataset](https://projects.asl.ethz.ch/datasets/doku.php?id=kmavvisualinertialdatasets) — VIO 평가 표준 데이터셋

### 12.2 컴퓨터 비전 데이터셋

### 12.2.1 ImageNet

이미지 분류의 표준 벤치마크이다.

딥러닝 전환기의 출발점이 된 데이터셋이다. 2012년 AlexNet이 ImageNet에서 압도적 성능을 보여준 이후, 거의 모든 비전 모델이 ImageNet 사전학습(pretrained) 가중치를 사용하게 되었다. 로보틱스에서도 카메라 기반 인식 모듈의 백본(backbone)은 대부분 ImageNet에서 사전학습된 모델을 가져다 쓴다.

- 1000 클래스
- 120만 학습 이미지
- 사전학습(pretraining) 표준

### 12.2.2 COCO

객체 탐지, 세그멘테이션의 표준이다.

Object detection 연구를 한다면 COCO 데이터셋의 평가 메트릭(COCO mAP)은 업계 표준이므로 이해해야 한다. IoU threshold별 AP를 계산하는 방식이 PASCAL VOC와 다르니 주의할 것.

**특징**:
- 80 객체 카테고리
- 33만 이미지, 150만 객체 인스턴스
- Dense annotation (bounding box, segmentation mask)

**태스크**:
- Object detection
- Instance segmentation
- Keypoint detection
- Captioning

### 12.2.3 ScanNet / NYU Depth V2

**ScanNet**:
- 1513개 실내 장면
- RGB-D 시퀀스
- 3D semantic segmentation
- 카메라 포즈, 메시 제공

**NYU Depth V2**:
- 실내 RGB-D
- Depth estimation 벤치마크
- 464 장면, 407K 프레임

실내 로봇(가정용, 서비스 로봇 등)을 한다면 ScanNet과 NYU Depth V2는 핵심 벤치마크이다. 특히 ScanNet은 3D 장면 이해(Scene Understanding) 연구에서 빠지지 않는다.

> **추천 자료**
> - [COCO Dataset](https://cocodataset.org/) — 공식 사이트, 데이터셋 다운로드 및 evaluation 도구
> - [ScanNet Benchmark](http://www.scan-net.org/) — 3D Scene Understanding 벤치마크
> - [Papers With Code - Datasets](https://paperswithcode.com/datasets) — 태스크별 데이터셋 검색 및 리더보드 통합 사이트

### 12.3 데이터셋 활용법

### 12.3.1 다운로드 및 포맷 이해

각 데이터셋마다 고유한 디렉토리 구조와 포맷이 있다.

데이터셋을 다운로드했는데 디렉토리 구조와 라벨 포맷을 제대로 이해하지 못하면, 데이터 로더를 짜는 데만 며칠이 걸릴 수 있다. 특히 3D 라벨은 좌표계(coordinate system)가 데이터셋마다 다르므로(카메라 좌표계 vs LiDAR 좌표계, y-up vs z-up 등) 문서를 꼼꼼히 읽어야 한다.

**예시: KITTI Object Detection**:

```
kitti/
├── training/
│   ├── image_2/       # Left RGB images
│   ├── velodyne/      # LiDAR point clouds (.bin)
│   ├── calib/         # Calibration files
│   └── label_2/       # 2D/3D annotations
└── testing/
    └── ...
```

**라벨 파일 읽기 예시**:

```python
# KITTI label format: type truncated occluded alpha bbox(4) dimensions(3) location(3) rotation_y
with open('label.txt', 'r') as f:
    for line in f:
        parts = line.strip().split()
        obj_type = parts[0]
        bbox = [float(x) for x in parts[4:8]]  # left, top, right, bottom
        dimensions = [float(x) for x in parts[8:11]]  # height, width, length
        location = [float(x) for x in parts[11:14]]  # x, y, z
```

> **추천 자료**
> - [KITTI Benchmark 공식 사이트 - Object Detection DevKit](https://www.cvlibs.net/datasets/kitti/eval_object.php?obj_benchmark=3d) — 라벨 포맷 설명 및 평가 코드
> - [nuScenes devkit Tutorial Notebooks](https://github.com/nutonomy/nuscenes-devkit/tree/master/python-sdk/tutorials) — Jupyter 노트북으로 데이터 구조 이해

### 12.3.2 DataLoader 구현

PyTorch에서 데이터 로딩을 위한 표준 패턴이다.

PyTorch의 `Dataset`과 `DataLoader` 패턴을 모르면 학습 코드를 짤 수 없다. 특히 `__getitem__`에서 데이터를 어떻게 전처리하느냐, `num_workers`를 몇으로 설정하느냐에 따라 학습 속도가 크게 달라질 수 있다.

```python
from torch.utils.data import Dataset, DataLoader

class MyDataset(Dataset):
    def __init__(self, root_dir, transform=None):
        self.root_dir = root_dir
        self.transform = transform
        self.samples = self._load_samples()

    def _load_samples(self):
        # 파일 목록 로드
        return list_of_samples

    def __len__(self):
        return len(self.samples)

    def __getitem__(self, idx):
        sample = self.samples[idx]
        image = load_image(sample['image_path'])
        label = sample['label']

        if self.transform:
            image = self.transform(image)

        return image, label

# 사용
dataset = MyDataset(root_dir='./data')
dataloader = DataLoader(dataset, batch_size=32, shuffle=True, num_workers=4)
```

> **추천 자료**
> - [PyTorch Data Loading Tutorial](https://pytorch.org/tutorials/beginner/data_loading_tutorial.html) — 커스텀 Dataset 작성 공식 가이드
> - [Real Python - PyTorch DataLoader](https://realpython.com/python-data-loading/) — DataLoader 활용법 상세 설명

### 12.4 자체 데이터 수집

공개 데이터셋만으로는 자기 연구에 딱 맞는 데이터를 구할 수 없는 경우가 많다. 자체 로봇에 맞는 센서 구성, 특수한 환경 조건 등을 위해 직접 데이터를 수집해야 할 때가 있다. 이때 센서 동기화, 캘리브레이션, 라벨링 과정을 체계적으로 해 두지 않으면 나중에 데이터를 못 쓰게 되는 상황이 생긴다.

### 12.4.1 센서 동기화

여러 센서의 데이터를 시간 동기화하지 않으면 퓨전 자체가 의미가 없다.

카메라와 LiDAR의 타임스탬프가 10ms만 어긋나도 고속 주행 시 수십 cm의 위치 오차가 생긴다. 센서 퓨전의 기본 전제가 "같은 시점의 데이터"인데, 동기화가 안 되면 그 전제가 무너진다.

**하드웨어 동기화**:
- 트리거 신호로 동시 촬영
- PPS (Pulse Per Second) 신호

**소프트웨어 동기화**:
- 타임스탬프 기반 근사 동기화
- 보간(interpolation) 사용

**ROS에서는 받는 시점만 필터링 가능:**

```python
import message_filters

# Approximate Time Synchronizer
image_sub = message_filters.Subscriber(self, Image, '/camera/image')
lidar_sub = message_filters.Subscriber(self, PointCloud2, '/lidar/points')

sync = message_filters.ApproximateTimeSynchronizer(
    [image_sub, lidar_sub], queue_size=10, slop=0.1
)
sync.registerCallback(self.callback)
```

### 12.4.2 캘리브레이션

**Camera Intrinsic**: 체커보드 사용 (OpenCV calibrateCamera)

**Camera-LiDAR Extrinsic**:
- 체커보드 기반 (평면 맞춤)
- Target-based (특수 타겟 사용)
- Target-less (자동 특징점 매칭)

**Camera-IMU**: Kalibr 사용 권장

캘리브레이션이 부정확하면 카메라에서 본 객체 위치와 LiDAR에서 본 객체 위치가 일치하지 않게 된다. 센서 퓨전의 정확도는 캘리브레이션 품질에 직결된다. 선형대수를 배웠다면, intrinsic은 3x3 카메라 행렬 K, extrinsic은 4x4 변환 행렬 [R|t]에 해당한다.

> **추천 자료**
> - [OpenCV Camera Calibration Tutorial](https://docs.opencv.org/4.x/dc/dbb/tutorial_py_calibration.html) — 체커보드 기반 카메라 캘리브레이션
> - [Kalibr GitHub](https://github.com/ethz-asl/kalibr) — Camera-IMU 캘리브레이션 표준 도구

### 12.4.3 라벨링 도구

데이터를 수집했으면 라벨링(annotation)을 해야 한다. 라벨링은 연구에서 가장 시간이 많이 드는 작업 중 하나이며, 라벨 품질이 모델 성능을 좌우한다. 최근에는 SAM(Segment Anything Model) 같은 기초 모델을 활용한 반자동 라벨링이 보편화되고 있다.

**CVAT (Computer Vision Annotation Tool)**:
- 웹 기반, 무료
- 이미지, 비디오 annotation
- 다양한 태스크 지원 (bbox, polygon, points)

**Labelbox**:
- 클라우드 기반
- 팀 협업 기능
- 3D annotation 지원

**3D Labeling**:
- SUSTechPOINTS: LiDAR 포인트 클라우드
- KITTI-360 labeling tool

**합성 데이터를 통한 자동 라벨링**: 시뮬레이터(NVIDIA Isaac Sim, AI2-THOR 등)에서 데이터를 생성하면 라벨이 자동으로 함께 생성되므로 수동 라벨링이 필요 없다. Domain Randomization을 통해 텍스처, 조명, 배경을 무작위로 변형하면 모델의 일반화 성능도 높일 수 있다. 실제 데이터 대비 수집 비용이 거의 0에 가깝다는 것이 큰 장점이다.

> **추천 자료**

## 13. 연구실 연구 방향

이 챕터에서는 우리 연구실이 어떤 방향으로 연구를 하고 있는지, 그리고 왜 그런 구조를 택했는지를 이야기한다. 앞 챕터들에서 배운 개념들이 실제 연구에서 어떻게 엮이는지를 보는 챕터이기도 하다.

### 13.1 개요

Spatial AI 시스템을 **두 개의 모듈**로 구분하여 설계한다.

```
┌──────────────────────────────────────────────────────────────┐
│                     Spatial AI System                         │
├──────────────────────────────────────────────────────────────┤
│  ┌─────────────────────┐     ┌─────────────────────────────┐ │
│  │   Local Module      │     │      Global Module          │ │
│  │   (경량, 온보드)     │ ←→  │   (중량, 서버/클라우드)      │ │
│  │                     │     │                             │ │
│  │ • 실시간 Geometry    │     │ • VFM 기반 이해             │ │
│  │ • Odometry          │     │ • Semantic Scene Graph      │ │
│  │ • Local Obstacle    │     │ • Long-term Memory          │ │
│  │ • 10-100 Hz         │     │ • 1-10 Hz                   │ │
│  └─────────────────────┘     └─────────────────────────────┘ │
└──────────────────────────────────────────────────────────────┘
```

**왜 두 모듈인가? — 직관적으로 이해하기**

"그냥 좋은 컴퓨터 하나 올리면 안 되나요?"라고 생각할 수 있다. 솔직히 그게 가능하면 그렇게 하고 싶다. 하지만 현실은 그렇지 않다.

먼저 **물리적 제약**을 생각해 보자. 로봇은 움직여야 한다. NVIDIA A100 GPU 서버를 드론에 올릴 수는 없다 — 무게만 해도 수십 kg이고, 전력도 수백 와트를 먹는다. 배터리로 돌아가는 로봇에게는 비현실적이다. 그래서 로봇에 실제로 탑재할 수 있는 컴퓨터는 Jetson Orin 같은 임베디드 보드인데, 이 보드로는 DINOv2나 SAM 같은 대형 모델을 실시간으로 돌릴 수 없다.

다음으로 **시간 제약**이 있다. 로봇이 복도를 걸어가고 있는데, 벽에 부딪히기 0.1초 전에 "잠깐, 서버 응답 기다리는 중..."이면 안 된다. 장애물 회피처럼 "지금 당장" 반응해야 하는 것과, "저 물체가 뭔지 이해하기" 처럼 좀 느려도 괜찮은 것은 본질적으로 다른 종류의 문제다.

그래서 우리는 이렇게 나눈다:

1. **계산 자원의 현실**: 로봇 온보드 컴퓨터(Jetson 등)는 대형 모델을 돌릴 여력이 없다
2. **실시간 요구사항**: 장애물 회피는 즉각 반응 필요 — 0.1초가 생사를 가른다
3. **깊은 이해**: VFM/VLA는 높은 계산량 필요 — "저건 깨진 유리컵이니 조심해" 같은 판단
4. **상호 보완**: 기하학적 정밀함(Local) + 의미론적 이해(Global) = 진짜 똑똑한 로봇

> 비유하자면, Local Module은 로봇의 **반사 신경**이고, Global Module은 로봇의 **대뇌 피질**이다. 뜨거운 냄비를 만지면 손을 먼저 떼고(반사), 그 다음에 "아, 불이 켜져 있었구나"라고 이해한다(인지). 로봇도 마찬가지다.

### 13.2 Local Module: Lightweight Geometry

로봇에 직접 탑재되어 실시간으로 동작하는 모듈이다. 로봇이 "지금 이 순간" 안전하게 움직이기 위해 필요한 최소한의 정보를 처리한다.

#### 13.2.1 목표

- **Odometry**: 자신의 움직임 추정 — "나는 지금 어디에 있는가?"
- **Obstacle Detection**: 즉각적인 장애물 감지 — "앞에 뭔가 있다, 피해!"
- **Local Mapping**: 주변 환경의 기하학적 지도 — "내 주변 3m 이내는 이렇게 생겼다"

**실제 시나리오**: 배달 로봇이 아파트 복도를 지나가고 있다고 하자. 갑자기 아이가 뛰어나온다. 이때 Local Module은 depth 센서로 즉시 장애물을 감지하고, odometry로 자기 위치를 파악해서, 0.05초 안에 회피 경로를 계산한다. "아이인지 강아지인지"는 몰라도 된다 — 그건 Global Module의 일이다. Local Module은 "앞에 뭔가 있으니 피하자"만 알면 된다.

#### 13.2.2 특징

- **저지연**: 10-100 Hz 동작 (10ms~100ms마다 한 번씩 처리)
- **제한된 자원**: Jetson, 임베디드 GPU — 전력 15~30W 수준
- **확정적 동작**: 예측 가능한 응답 시간 — "최악의 경우에도 50ms 안에 답을 준다"

#### 13.2.3 기술 스택

**Classical 방법**:
- ORB-SLAM3: Feature-based Visual SLAM — 카메라 하나로 위치 추정 (→ 4장, 9장 참고)
- VINS-Mono: Visual-Inertial Odometry — 카메라+IMU 융합 (→ 9장 참고)
- FAST-LIO2: LiDAR-Inertial Odometry — LiDAR+IMU 융합 (→ 2장, 9장 참고)

**경량 학습 모델**:
- 경량 depth estimation — MobileNet 기반으로 압축 (→ 5장 참고)
- 압축된 segmentation 모델 — knowledge distillation 적용 (→ 5장, 6장 참고)
- TensorRT 최적화 — NVIDIA GPU에서 2-5배 속도 향상

**Edge 배포**:

```bash
# TensorRT 최적화 예시
trtexec --onnx=model.onnx --saveEngine=model.trt --fp16 --workspace=4096
```

> TensorRT가 뭐냐면, PyTorch로 학습한 모델을 NVIDIA GPU에 최적화된 형태로 변환해주는 도구다. FP16(반정밀도)으로 바꾸면 모델 크기가 절반이 되면서도 정확도는 거의 유지된다. Jetson에서 YOLO를 돌릴 때 TensorRT 없이는 5 FPS, 있으면 30 FPS — 이 차이가 실제 로봇에서는 "쓸 수 있다 vs 없다"의 차이다.

#### 13.2.4 예시 구현

```python
# Local Module 개념 코드
class LocalModule:
    def __init__(self):
        self.odometry = FastLIO2()
        self.obstacle_detector = LightweightObstacleNet()  # TensorRT

    def process(self, sensor_data):
        # 1. Odometry 업데이트 (100 Hz)
        pose = self.odometry.update(sensor_data.imu, sensor_data.lidar)

        # 2. 장애물 감지 (30 Hz)
        obstacles = self.obstacle_detector(sensor_data.image)

        # 3. Global Module로 키프레임 전송
        if self.is_keyframe(pose):
            self.send_to_global(sensor_data, pose)

        return pose, obstacles
```

**시나리오로 읽기**: 위 코드에서 `process()`는 센서 데이터가 들어올 때마다 호출된다. IMU 데이터는 100Hz(초당 100번)로 오고, 카메라 이미지는 30Hz로 온다. 매 프레임마다 "나 지금 어디?" (odometry)와 "앞에 뭐 있어?" (obstacle)를 계산하고, 중요한 순간(키프레임)에만 Global Module에 데이터를 보낸다. 모든 프레임을 보내면 네트워크가 터지니까.

### 13.3 Global Module: VFM-based Understanding

서버 또는 클라우드에서 동작하는 고수준 이해 모듈이다. Local Module이 "앞에 뭔가 있다"까지만 알면, Global Module은 "저건 깨진 유리잔이고, 주인이 거실에서 떨어뜨린 것 같다"까지 이해한다.

#### 13.3.1 목표

- **전체 지도 이해**: 공간 구조와 의미 파악 — "여기는 주방이고, 저기는 거실이다"
- **Semantic Scene Graph**: 객체 간 관계 표현 — "컵이 테이블 위에 있다"
- **Long-term Memory**: 환경 변화 추적 — "어제는 여기에 의자가 없었는데 오늘은 있다"

**실제 시나리오**: 가정용 서비스 로봇이 매일 집 안을 돌아다니면서 환경을 학습한다. Global Module은 "거실에 소파, TV, 테이블이 있고, 주방에는 냉장고, 싱크대가 있다"는 고수준 지도를 유지한다. 사용자가 "거실 테이블에 있는 리모컨 가져와"라고 하면, Scene Graph에서 리모컨의 위치를 찾아 Local Module에 waypoint를 전달한다.

#### 13.3.2 특징

- **높은 정확도**: 대형 VFM 활용 — DINOv2, SAM2 같은 수십억 파라미터 모델
- **풍부한 컴퓨팅**: GPU 서버, 클라우드 — RTX 4090, A100 수준의 GPU
- **비실시간 허용**: 1-10 Hz — "1초에 한 번 업데이트해도 괜찮다"

#### 13.3.3 기술 스택

**Vision Foundation Models** (→ 6장 참고):
- DINOv2: Dense feature extraction — 이미지의 모든 픽셀에 대해 의미 있는 feature 벡터 생성
- SAM2: Open-vocabulary segmentation — "아무 물체나" 지정하면 정확하게 분리
- GroundingDINO: Text-guided detection — "빨간 컵"이라고 말하면 찾아줌

**3D Understanding** (→ 6장, 8장 참고):
- Gaussian Splatting with semantic features — 예쁘고 빠른 3D 재구성 + 의미 정보
- 3D Scene Graph 구축 — 객체들의 관계를 그래프로 표현
- VFM features의 3D lifting — 2D 이미지에서 뽑은 feature를 3D 공간에 올리기

**Language Integration** (→ 6장, 7장 참고):
- CLIP features for open-vocabulary — "본 적 없는 물체"도 텍스트로 검색 가능
- LLM for scene reasoning — "이 방은 어떤 용도일까?" 추론
- VLA for action planning — "컵을 집으려면 어떻게 팔을 움직여야 할까?"

#### 13.3.4 예시 구현

```python
# Global Module 개념 코드
class GlobalModule:
    def __init__(self):
        self.dinov2 = load_dinov2()
        self.sam = load_sam2()
        self.scene_graph = SemanticSceneGraph()
        self.gaussian_map = GaussianSplatMap()

    def process_keyframe(self, image, depth, pose):
        # 1. VFM feature 추출
        features = self.dinov2.extract(image)

        # 2. Open-vocabulary segmentation
        masks = self.sam.segment(image, prompts=self.get_prompts())

        # 3. 3D Scene Graph 업데이트
        self.scene_graph.update(masks, depth, pose, features)

        # 4. Gaussian Map 업데이트
        self.gaussian_map.add_keyframe(image, depth, pose, features)

    def query(self, text_prompt):
        # "Where is the red cup?" → 위치 반환
        return self.scene_graph.find(text_prompt)
```

**시나리오로 읽기**: Local Module에서 키프레임이 올 때마다 `process_keyframe()`이 호출된다. DINOv2로 이미지에서 rich한 feature를 뽑고, SAM으로 물체들을 분리하고, 이걸 3D Scene Graph와 Gaussian Map에 누적한다. 나중에 사용자가 "빨간 컵 어디 있어?"라고 물으면 `query()`로 검색한다. 이 전체 과정이 1초 정도 걸려도 괜찮다 — 실시간 안전은 Local Module이 책임지니까.

### 13.4 두 모듈의 협업

두 모듈은 독립적으로 동작하지만, 서로 정보를 주고받으며 협력한다. 마치 드라이버(Local)와 네비게이션 앱(Global)의 관계와 비슷하다 — 드라이버는 눈앞의 도로를 보고 운전하고, 네비게이션은 전체 경로를 안내한다.

#### 13.4.1 Local → Global

**전송 내용**:
- 키프레임 이미지/포인트 클라우드
- 로컬 포즈
- 센서 메타데이터

**키프레임 선택 기준**:
- 이동 거리/회전량 threshold — "1m 이동하거나 30도 회전하면 보내기"
- 장면 변화 감지 — "새로운 방에 들어갔다"
- 정보량 (특징점 수, 커버리지) — "이 프레임에 새로운 정보가 많다"

#### 13.4.2 Global → Local

**전송 내용**:
- 사전 지도 (필요 영역) — "주방 근처의 장애물 정보"
- Semantic 정보 (객체 위치, 클래스) — "테이블은 여기, 의자는 저기"
- 네비게이션 waypoints — "이 경로를 따라가라"

**예시 시나리오**:

```
1. 사용자: "Go to the kitchen and bring the cup"

2. Global:
   - VLM으로 명령 이해
   - Scene Graph에서 kitchen, cup 위치 찾기
   - 경로 계획

3. Global → Local:
   - Waypoints: [현재 → 복도 → 주방 → 컵 앞]
   - 주방 영역의 local map
   - 컵의 예상 위치

4. Local:
   - Waypoints 따라 이동
   - 실시간 장애물 회피
   - 컵 근처에서 정밀 접근
```

**다른 시나리오 — 통신 불안정 상황**: 로봇이 지하 주차장에서 작업 중인데 WiFi가 끊어졌다. 이 경우 Local Module만으로 동작해야 한다. Odometry로 위치를 추정하고, 장애물을 피하면서 마지막으로 받은 waypoint까지 이동한다. WiFi가 복구되면 그동안의 데이터를 Global에 한꺼번에 보내고, 업데이트된 계획을 받는다. 이런 **graceful degradation**이 실제 로봇에서는 매우 중요하다.

#### 13.4.3 통신 및 동기화

**통신 방식**:
- ROS2 DDS: 로컬 네트워크 (같은 건물 안)
- WebSocket: 클라우드 연결 (원격 서버)
- 5G/WiFi: 모바일 로봇 (실외 환경)

**동기화 전략**:
- 키프레임 기반 (연속 스트리밍 X) — 대역폭 절약
- 비동기 처리 (Global 완료 안 기다림) — Local은 멈추지 않는다
- 캐싱 (자주 방문 영역) — 매번 같은 데이터를 보내지 않는다

### 13.5 연구 과제 예시

아래 연구 과제들은 실제로 우리 연구실에서 진행하거나 진행할 수 있는 주제들이다. 각 과제에 대해 **선행 학습이 필요한 챕터**를 표시해두었으니, 관심 있는 주제가 있으면 해당 챕터부터 공부하자.

#### Local Module 연구

1. **더 가벼운 SLAM**
    - 신경망 기반 경량 VO — 기존 VO를 neural network로 대체하되, Jetson에서 돌아가게
    - 이벤트 카메라 활용 — 초고속, 저전력 카메라로 극한 환경에서 SLAM
    - 하드웨어 가속 (FPGA) — SLAM의 핵심 연산을 하드웨어로 구현
    - **선행 학습**: 4장(카메라 모델), 9장(Visual Odometry, SLAM) 필수. 3장(최적화)도 권장
2. **효율적 장애물 인식**
    - Depth-only obstacle detection — RGB 없이 depth 정보만으로 장애물 감지
    - Temporal consistency — 프레임 간 일관성 유지 (한 프레임에서 보였다 안 보였다 하면 안 됨)
    - Uncertainty-aware — "이게 장애물인지 확실하지 않다"는 정보도 활용
    - **선행 학습**: 5장(Depth Estimation, Object Detection) 필수. 3장(좌표 변환)도 중요
3. **센서 융합 최적화**
    - Tight coupling 경량화 — IMU+Camera+LiDAR를 촘촘하게 결합하되 가볍게
    - 센서 드롭아웃 대응 — 센서 하나가 고장나도 계속 동작
    - **선행 학습**: 2장(센서), 9장(Visual Odometry), 3장(최적화) 필수

#### Global Module 연구

1. **VFM의 3D 확장**
    - DINOv2 features in 3D — 2D feature를 3D 공간에 올려서 활용
    - Semantic Gaussian Splatting — 3D 재구성에 의미 정보를 같이 넣기
    - 3D scene understanding — "이 공간은 어떤 구조인가" 이해
    - **선행 학습**: 5장(Depth), 8장(3D 표현), 6장(VFM) 필수. 4장(카메라 모델)은 기본
2. **VLA 통합**
    - Open-vocabulary manipulation — "저 빨간 거 집어" 같은 명령으로 로봇팔 제어
    - Language-guided navigation — 자연어 명령으로 이동
    - 상황 인식 행동 — "아이가 있으니 천천히 움직여라"
    - **선행 학습**: 6장(VFM 활용), 7장(VLA) 필수. 5장(Detection)도 알면 좋다
3. **Scalability**
    - 대규모 환경 표현 — 아파트 단지 전체, 캠퍼스 전체를 하나의 지도로
    - 지도 압축 및 업데이트 — 수 GB짜리 지도를 효율적으로 관리
    - Multi-robot 협업 — 여러 로봇이 함께 지도를 만들고 공유
    - **선행 학습**: 9장(SLAM), 3장(최적화), 6장(VFM) 필수

#### Integration 연구

1. **효율적 통신**
    - 무엇을 언제 전송할 것인가? — 모든 걸 보내면 대역폭 낭비, 안 보내면 Global이 무용지물
    - 대역폭 제한 하 최적 전략 — 5G가 끊기면? WiFi가 느리면?
    - **선행 학습**: 9장(SLAM, 키프레임 선택), 위 Local/Global 모듈 이해
2. **Fallback 전략**
    - 통신 끊김 시 Local-only 동작 — 서버 연결 없이도 기본 임무 수행
    - Graceful degradation — 기능이 점진적으로 줄어들되, 갑자기 멈추지는 않기
    - **선행 학습**: 전체적인 시스템 이해 필요. 최소 3-9장은 읽고 오자
3. **일관성 유지**
    - Local/Global 지도 동기화 — 두 모듈의 지도가 다르면 로봇이 혼란
    - Semantic 정보 일관성 — "저건 의자"라고 했는데 나중에 "테이블"로 바뀌면 안 됨
    - **선행 학습**: 3장(최적화), 9장(SLAM, 맵 관리) 필수

## 14. AI 코딩 에이전트와 협업하기

### 14.1 왜 이 챕터가 필요한가

AI 코딩 에이전트(Claude, Copilot, ChatGPT 등)는 일반 소프트웨어 개발에서는 강력한 도구다. 함수 하나 짜달라고 하면 꽤 쓸만한 코드가 나오고, 에러 메시지를 붙여넣으면 원인을 잘 짚어준다. 하지만 로보틱스는 다르다. 하드웨어, OS, 네트워크, 실시간성이 복잡하게 얽혀있고, "코드는 맞는데 안 되는" 상황이 일상이다. AI는 이런 영역에서 자주 틀리거나, 자신 있게 엉뚱한 방향을 제시하거나, 아예 포기한다.

이 챕터는 AI에게 속지 않고, AI를 제대로 부려먹기 위한 가이드다. 여기 나오는 내용은 전부 실제로 겪은 문제들이다. AI가 틀리는 패턴을 미리 알아두면 삽질이 줄어든다.

### 14.2 ROS에서 AI가 자주 틀리는 것들

#### 14.2.1 QoS 설정

AI는 거의 항상 QoS(Quality of Service)를 무시하거나 default(RELIABLE)로 놓는다. 문제는 센서 토픽(카메라, LiDAR)이 보통 BEST_EFFORT로 퍼블리시된다는 점이다. subscriber가 RELIABLE이면 데이터가 아예 안 들어온다. 에러 메시지도 안 뜨고 그냥 조용히 안 되니까, AI는 "토픽이 없나?" 하고 엉뚱한 방향으로 디버깅을 시작한다.

```bash
# 토픽의 QoS 프로파일 확인
ros2 topic info /camera/image_raw --verbose
```

출력에서 `Reliability: BEST_EFFORT`, `Durability: VOLATILE` 같은 정보를 확인하고, subscriber의 QoS를 맞춰야 한다.

```python
from rclpy.qos import QoSProfile, ReliabilityPolicy, DurabilityPolicy

qos = QoSProfile(
    reliability=ReliabilityPolicy.BEST_EFFORT,
    durability=DurabilityPolicy.VOLATILE,
    depth=10
)
self.subscription = self.create_subscription(Image, '/camera/image_raw', self.callback, qos)
```

AI에게 코드를 요청할 때는 "이 토픽의 QoS는 BEST_EFFORT / SENSOR_DATA다"라고 명시적으로 알려줘야 한다. 안 그러면 기본값으로 만들어서 데이터가 안 들어오는데, AI는 원인을 못 찾는다.

#### 14.2.2 use_sim_time과 tf2 타이밍

rosbag 재생 시 `use_sim_time:=true`를 안 하면 tf lookup이 전부 실패한다. AI는 "tf2 lookup failed" 에러를 보면 높은 확률로 `static_transform_publisher`를 추가하라고 한다. 엉뚱한 방향이다.

실제 원인은 시뮬레이션 클럭과 시스템 클럭의 불일치다. bag 파일의 타임스탬프는 과거 시점인데, 노드는 현재 시스템 시간을 기준으로 tf를 조회하니까 당연히 못 찾는다.

```bash
# 올바른 rosbag 재생
ros2 bag play my_bag --clock

# 노드 실행 시 sim_time 활성화
ros2 launch my_package my_launch.py use_sim_time:=true
```

tf2 lookup에는 timeout과 try/except가 필요한데, AI는 이걸 빼먹는 경우가 많다.

```python
from rclpy.duration import Duration

try:
    transform = tf_buffer.lookup_transform(
        'base_link', 'camera_link',
        rclpy.time.Time(),
        timeout=Duration(seconds=1.0)
    )
except tf2_ros.LookupException as e:
    self.get_logger().warn(f'TF lookup failed: {e}')
```

#### 14.2.3 Workspace 소싱 순서

ROS2 workspace의 소싱 순서가 중요하다. `/opt/ros/humble/setup.bash`를 먼저 source하고, 그 다음에 `~/ros2_ws/install/setup.bash`를 source해야 한다. AI는 하나만 source하거나, 순서를 뒤집거나, overlay workspace 개념 자체를 모르는 경우가 많다.

```bash
# 올바른 순서
source /opt/ros/humble/setup.bash
source ~/ros2_ws/install/setup.bash
```

`.bashrc`에 넣었는데 새 터미널에서 패키지를 못 찾으면, AI는 패키지 재설치를 권한다. 실제로는 `source` 문제인 경우가 대부분이다. `echo $AMENT_PREFIX_PATH`로 현재 소싱된 workspace를 확인하자.

#### 14.2.4 커스텀 메시지와 빌드

AI는 `.msg` 파일은 잘 만든다. 하지만 `CMakeLists.txt`와 `package.xml`의 의존성 추가를 빠뜨리는 경우가 잦다.

`rosidl_generate_interfaces` 설정이 빠지면 빌드는 되는데 Python에서 import할 때 실패한다. 이 에러가 나면 AI는 "패키지가 설치 안 됐다"고 오진하기 쉽다.

```cmake
# CMakeLists.txt에 반드시 추가
find_package(rosidl_default_generators REQUIRED)

rosidl_generate_interfaces(${PROJECT_NAME}
  "msg/MyCustomMsg.msg"
  DEPENDENCIES std_msgs geometry_msgs
)
```

```xml
<!-- package.xml에 반드시 추가 -->
<buildtool_depend>rosidl_default_generators</buildtool_depend>
<exec_depend>rosidl_default_runtime</exec_depend>
<member_of_group>rosidl_interface_packages</member_of_group>
```

또 하나: `--symlink-install` 없이 빌드하면 Python 코드 수정이 반영되지 않는다. AI는 이걸 "캐시 문제"라고 오진한다.

```bash
# Python 패키지 수정이 바로 반영되려면
colcon build --symlink-install
```

#### 14.2.5 네임스페이스와 리매핑

`ros2 topic echo /camera/image_raw` 했는데 데이터가 안 오면, AI는 드라이버 문제라고 진단하기 쉽다. 하지만 실제로는 네임스페이스 때문에 토픽 이름이 `/robot1/camera/image_raw`일 수 있다.

```bash
# 토픽 목록부터 확인하라
ros2 topic list

# 특정 패턴으로 필터링
ros2 topic list | grep camera
```

AI에게 디버깅을 시킬 때는 `ros2 topic list`와 `ros2 node list` 출력을 먼저 제공해야 한다. 이 정보 없이 "토픽이 안 들어와요"라고 하면 AI는 추측으로 답할 수밖에 없다.

#### 14.2.6 Launch 파일

AI가 ROS2 Python launch 파일을 쓸 때 흔히 하는 실수들:

- ROS1 XML 문법을 섞는다 (ROS2 launch는 Python이 기본이다)
- `LaunchDescription`의 action 순서를 잘못 잡는다 (노드 의존성 고려 필요)
- `ComposableNode` vs 일반 `Node` 구분을 못 한다
- `PushRosNamespace`를 빠뜨려서 multi-robot 설정이 꼬인다

```python
# multi-robot launch 파일에서 네임스페이스 적용
from launch.actions import GroupAction, PushRosNamespace

robot1_group = GroupAction([
    PushRosNamespace('robot1'),
    Node(package='my_pkg', executable='my_node', name='sensor_node'),
])
```

AI에게 launch 파일을 요청할 때는 "ROS2 Python launch 파일", "multi-robot이면 네임스페이스 적용", "ComposableNode 사용 여부" 등을 명시해야 한다.

### 14.3 Docker에서 AI가 모르는 것들

#### 14.3.1 GUI/시각화 문제

Docker 안에서 RViz나 Gazebo 같은 GUI 도구를 띄우려면 X11 포워딩이 필요하다. AI는 흔히 `xhost +local:docker`를 권하지만, 이건 모든 로컬 연결에 X 서버 접근을 허용하는 것이라 보안상 위험하다.

제대로 하려면 다음과 같이 설정한다:

```bash
docker run -it \
  --env DISPLAY=$DISPLAY \
  --env QT_X11_NO_MITSHM=1 \
  -v /tmp/.X11-unix:/tmp/.X11-unix:rw \
  --ipc=host \
  my_image
```

여기서 중요한 포인트:
- `QT_X11_NO_MITSHM=1` — AI는 이 옵션을 거의 모른다. 이거 없으면 RViz가 segfault로 죽는다. MIT-SHM(공유 메모리) 확장이 Docker 환경에서 제대로 동작하지 않기 때문이다.
- `--ipc=host` — 호스트와 IPC 네임스페이스를 공유한다. 이거 없으면 shared memory 문제로 시각화 도구가 죽는 경우가 많다.
- Wayland 환경(Ubuntu 22.04+ 기본)에서는 X11 소켓 마운트만으로 안 되는 경우가 있다. `XDG_SESSION_TYPE=x11`로 X11 세션을 강제하거나, XWayland를 거쳐야 할 수 있다.

#### 14.3.2 USB 디바이스 패스스루

카메라, LiDAR, IMU 등 USB 장치를 Docker 안에서 쓰려면 디바이스를 명시적으로 매핑해야 한다. AI는 보통 이걸 모르고 "드라이버 설치하라"고 한다.

```bash
# 특정 디바이스만 매핑 (권장)
docker run -it --device=/dev/ttyUSB0 --device=/dev/video0 my_image

# 모든 디바이스 접근 허용 (보안상 비추, 디버깅용으로만)
docker run -it --privileged my_image
```

`--privileged`는 편하지만 컨테이너에 호스트의 거의 모든 권한을 주는 것이므로, 프로덕션에서는 필요한 device만 매핑하는 게 맞다.

한 가지 더: USB 장치가 Docker 컨테이너 시작 후에 꽂히면 인식이 안 된다. AI는 이 상황을 전혀 고려하지 못한다. 컨테이너를 재시작하거나, `--privileged` + `-v /dev:/dev` 조합을 써야 한다.

#### 14.3.3 ROS 네트워킹

Docker 컨테이너 간 ROS2 통신에서 `--network=host`가 가장 간단하지만, 호스트의 포트를 전부 공유하므로 포트 충돌 위험이 있다.

AI는 bridge 네트워크에서 ROS2가 왜 안 되는지 모르는 경우가 많다. 원인은 DDS(Data Distribution Service)가 multicast를 사용하는데, Docker bridge 네트워크에서는 multicast가 기본적으로 안 되기 때문이다.

```bash
# 가장 간단한 방법 (개발 환경에서)
docker run -it --network=host my_ros2_image

# ROS_DOMAIN_ID로 다른 사람과 충돌 방지
docker run -it --network=host -e ROS_DOMAIN_ID=42 my_ros2_image
```

`ROS_DOMAIN_ID`가 같은 네트워크의 다른 사람 ROS2와 충돌할 수 있다. 연구실에서 여러 명이 동시에 ROS2를 쓰면 서로의 토픽이 보이는 상황이 생긴다.

DDS 설정을 세밀하게 해야 할 때는 Cyclone DDS config XML로 특정 네트워크 인터페이스만 사용하게 제한한다:

```xml
<!-- cyclone_dds.xml -->
<CycloneDDS>
  <Domain>
    <General>
      <NetworkInterfaceAddress>eth0</NetworkInterfaceAddress>
    </General>
  </Domain>
</CycloneDDS>
```

```bash
export CYCLONEDDS_URI=file:///path/to/cyclone_dds.xml
```

#### 14.3.4 파일 권한 문제

Docker 안에서 생성된 파일은 기본적으로 root 소유다. 호스트에서 편집하거나 삭제하려면 `sudo`가 필요하다.

```bash
# 호스트 유저 권한으로 실행
docker run -it --user $(id -u):$(id -g) my_image
```

하지만 일부 ROS 패키지가 root 권한을 필요로 해서 `--user` 옵션을 쓰면 또 안 되는 경우가 있다. AI는 이런 상황에서 `chmod 777`을 남발하는데, 실무에서는 이러면 안 된다. Dockerfile에서 non-root 유저를 만들고 필요한 디렉토리 권한만 설정하는 것이 올바른 방법이다.

```dockerfile
# Dockerfile에서 non-root 유저 설정
RUN useradd -m -s /bin/bash rosuser && \
    usermod -aG dialout rosuser
USER rosuser
```

### 14.4 하드웨어/드라이버에서 AI가 포기하는 것들

#### 14.4.1 시리얼 포트 권한

`/dev/ttyUSB0` 접근 시 `Permission denied`가 뜨면, AI는 `sudo chmod 666 /dev/ttyUSB0`을 권한다. 되긴 되지만, 재부팅하면 리셋된다. 매번 이걸 치고 있을 수는 없다.

올바른 방법은 udev rule을 작성하는 것이다:

```bash
# 벤더/프로덕트 ID 확인
udevadm info -a -n /dev/ttyUSB0 | grep -E 'idVendor|idProduct'
```

```bash
# /etc/udev/rules.d/99-sensors.rules
SUBSYSTEM=="tty", ATTRS{idVendor}=="1546", ATTRS{idProduct}=="01a9", MODE="0666", SYMLINK+="gps"
```

```bash
# udev rule 적용
sudo udevadm control --reload-rules && sudo udevadm trigger
```

이렇게 하면 해당 USB 장치가 항상 `/dev/gps`라는 고정 이름으로 잡히고, 권한도 자동으로 설정된다. 여러 개의 동일 장치를 구분해야 할 때(예: IMU 2개)도 시리얼 넘버로 구분할 수 있다. AI는 udev를 거의 모른다.

#### 14.4.2 USB 대역폭

USB3 카메라 3대를 같은 USB 허브에 꽂으면 대역폭 부족으로 프레임 드롭이 발생한다. AI는 "드라이버 업데이트하라" 또는 "해상도를 낮춰라"고 하지만, 실제 원인은 USB 컨트롤러의 대역폭 한계다.

```bash
# 어떤 카메라가 어떤 USB 컨트롤러에 붙어있는지 확인
lsusb -t
```

이 문제는 소프트웨어로 해결할 수 없다. 물리적으로 다른 USB 컨트롤러에 카메라를 분산 연결해야 한다. 데스크탑 PC의 앞면 USB와 뒷면 USB가 다른 컨트롤러에 연결되어 있는 경우가 많으니, `lsusb -t`의 Bus 번호를 확인하고 분산 배치하자.

#### 14.4.3 LiDAR 연결 (IP 설정)

Velodyne이나 Ouster LiDAR에서 "데이터가 안 온다"는 문제의 90%는 네트워크 설정이 원인이다. AI는 드라이버 재설치나 ROS 패키지 재빌드를 권하지만, 그 전에 확인해야 할 것이 있다.

LiDAR는 고정 IP(예: `192.168.1.201`)를 사용한다. 호스트 PC의 이더넷 인터페이스를 같은 서브넷(예: `192.168.1.100`)으로 설정해야 통신이 된다.

```bash
# 1단계: LiDAR에 ping이 되는지 확인
ping 192.168.1.201

# 2단계: 호스트 이더넷 인터페이스 IP 설정
sudo ip addr add 192.168.1.100/24 dev eth0
sudo ip link set eth0 up

# 3단계: UDP 패킷이 오는지 Wireshark로 확인
sudo tcpdump -i eth0 udp port 2368 -c 10
```

`ping`부터 해보면 대부분 여기서 걸린다. Wireshark(또는 tcpdump)로 UDP 패킷이 오는지 확인하는 게 가장 확실한 디버깅 방법이다. 패킷이 오는데 ROS에서 안 보이면 그때 드라이버를 의심해도 늦지 않다.

#### 14.4.4 카메라 드라이버 (v4l2)

AI는 `cv2.VideoCapture(0)`만 알지, `/dev/video*`가 여러 개일 때 어떤 게 실제 카메라인지 구분하지 못한다. USB 카메라 하나를 꽂아도 `/dev/video0`, `/dev/video1`이 생기는 경우가 흔한데(metadata용 디바이스), AI는 이걸 모른다.

```bash
# 카메라 디바이스 매핑 확인
v4l2-ctl --list-devices

# 지원하는 포맷과 해상도 확인
v4l2-ctl -d /dev/video0 --list-formats-ext
```

자동 노출(auto exposure), 자동 화이트밸런스 — 이런 자동 설정이 SLAM 성능을 망치는 경우가 많다. 밝기가 계속 변하면 특징점 추출이 불안정해진다.

```bash
# 수동 노출 설정 (SLAM용)
v4l2-ctl -d /dev/video0 --set-ctrl=exposure_auto=1
v4l2-ctl -d /dev/video0 --set-ctrl=exposure_absolute=100

# 화이트밸런스 고정
v4l2-ctl -d /dev/video0 --set-ctrl=white_balance_automatic=0
```

AI는 이런 low-level 카메라 제어를 거의 모른다. "SLAM이 불안정하다"고 하면 알고리즘 파라미터 튜닝을 권하지만, 카메라 자동 설정을 끄는 것만으로 극적으로 개선되는 경우가 있다.

#### 14.4.5 Jetson (ARM) 환경

AI가 생성한 코드나 Docker 설정은 거의 100% x86 기준이다. NVIDIA Jetson(ARM64)에서는 안 돌아가는 경우가 많다.

주의해야 할 점:
- `pip install`로 설치할 때 pre-built 바이너리(wheel)가 ARM용으로 없는 패키지가 많다. 특히 `scipy`, `opencv-python`은 소스에서 빌드해야 해서 수십 분이 걸린다.
- JetPack 버전에 따라 CUDA, cuDNN, TensorRT 버전이 고정되어 있다. AI가 최신 버전을 설치하라고 권하면 전체 시스템이 꼬인다.
- Docker를 쓸 때는 NVIDIA에서 제공하는 `l4t`(Linux for Tegra) 기반 이미지를 써야 한다.

```bash
# Jetson에서 Docker 이미지 — x86 이미지 쓰면 안 된다
docker pull nvcr.io/nvidia/l4t-pytorch:r35.2.1-pth2.0-py3

# JetPack 버전 확인
cat /etc/nv_tegra_release
```

AI에게 코드를 요청할 때는 "Jetson Orin, JetPack 5.1.2, CUDA 11.4 환경이다"라고 명시해야 한다.

#### 14.4.6 실시간 제어와 타이밍

AI는 `time.sleep(0.01)`로 100Hz 루프를 만들라고 하지만, 실제로는 정확하지 않다. `time.sleep()`의 정밀도는 OS 스케줄러에 의존하며, 일반 Linux 커널에서는 수 밀리초의 jitter가 발생한다.

```python
# AI가 주로 권하는 방법 (정확하지 않음)
import time
while True:
    do_control()
    time.sleep(0.01)  # 실제로는 10~15ms가 될 수 있다
```

Python의 GIL(Global Interpreter Lock) 때문에 멀티스레드 타이밍은 더 보장이 안 된다. 진짜 실시간 제어가 필요하면 C++과 RT(Real-Time) 커널(PREEMPT_RT)을 써야 한다.

```bash
# 실제 퍼블리시 주파수 확인 — 항상 이걸로 검증하라
ros2 topic hz /cmd_vel
```

AI가 "100Hz로 제어하면 된다"고 해도, `ros2 topic hz`로 실제 주파수를 확인해야 한다. 기대한 주파수와 실제 주파수가 다르면 제어가 제대로 안 된다.

### 14.5 AI 에이전트가 포기하는 패턴들

#### 14.5.1 "It works in simulation"

Gazebo에서 잘 되는데 실제 로봇에서 안 되는 상황. AI는 "시뮬레이션에서 되니까 코드는 맞고 하드웨어 문제"라고 결론 내리기 쉽다. 하지만 실제 원인은 sim-to-real gap인 경우가 대부분이다:

- **센서 노이즈**: 시뮬레이션의 가우시안 노이즈와 실제 센서 노이즈는 분포가 다르다
- **통신 지연**: Gazebo 안에서는 토픽 전달이 즉시지만, 실제로는 수~수십 ms의 지연이 있다
- **타이밍 불일치**: 시뮬레이션은 완벽한 동기화를 보장하지만, 실제로는 센서 간 타임스탬프가 어긋난다
- **좌표계 불일치**: URDF와 실제 로봇의 센서 위치/각도가 미세하게 다르면 tf가 틀어진다

AI에게는 "시뮬레이션에서는 되는데 실제 로봇에서 안 된다. 센서 노이즈 수준은 X이고, 통신 지연은 Y ms이고, 좌표계 캘리브레이션은 Z 방법으로 했다"처럼 sim-to-real의 차이를 구체적으로 알려줘야 한다.

#### 14.5.2 하드웨어 문제를 소프트웨어로 고치려 함

케이블 불량, 접촉 불량, 전원 부족 — AI는 이런 물리적 문제를 진단할 수 없다.

"센서 데이터가 간헐적으로 끊긴다"고 하면 AI는 버퍼 크기 조절, 타임아웃 설정, QoS 변경 등을 권한다. 하지만 실제로는 USB 케이블이 느슨하거나, USB 허브의 전원이 부족한 경우가 많다.

```bash
# 커널 로그에서 하드웨어 문제 단서 찾기
dmesg | tail -20

# USB 연결 해제/재연결 이벤트 확인
dmesg | grep -i usb | tail -20
```

`dmesg`에 `USB disconnect`, `device descriptor read/64, error -71` 같은 메시지가 보이면 소프트웨어 문제가 아니다. 케이블을 교체하거나, 유전원 USB 허브를 쓰거나, 다른 포트에 꽂아보는 게 먼저다.

#### 14.5.3 환경 문제 진단 포기

라이브러리 버전 충돌이 복잡하게 얽히면 AI는 "전부 재설치하라"고 한다. 실제로는 `pip show package_name`으로 버전을 확인하고, 어떤 것이 충돌하는지 좁혀야 한다.

특히 OpenCV 관련 충돌은 로보틱스의 클래식이다:

- `opencv-python` (기본)
- `opencv-python-headless` (GUI 없는 서버용)
- `opencv-contrib-python` (추가 모듈 포함)
- `cv_bridge` (ROS 패키지, 자체 OpenCV를 참조)

이 네 가지가 동시에 설치되면 서로 충돌한다.

```bash
# 현재 설치된 OpenCV 확인
pip show opencv-python opencv-python-headless opencv-contrib-python

# 해결: ROS 환경에서는 pip opencv를 설치하지 않는다
pip uninstall opencv-python opencv-python-headless opencv-contrib-python
sudo apt install ros-humble-cv-bridge
```

ROS 환경에서는 `apt install ros-humble-cv-bridge`만 쓰고, pip으로 opencv를 따로 설치하지 않는 것이 가장 깔끔하다.

#### 14.5.4 "2-3번 시도 후 포기"

AI는 같은 접근을 2-3번 반복하다 안 되면 "다른 방법을 시도해 보세요"라며 넘긴다. 엔지니어는 여기서 포기하지 않는다. 로그를 뒤지고, strace를 걸고, 패킷을 캡처한다.

AI에게 더 좋은 답을 얻으려면, 에러 메시지뿐 아니라 low-level 정보를 함께 줘야 한다:

```bash
# 시스템 로그
dmesg | tail -30
journalctl -u my_service --since "5 minutes ago"

# 프로세스 추적
strace -f -e trace=open,read,write ros2 run my_pkg my_node 2>&1 | head -100

# 네트워크 패킷 캡처
sudo tcpdump -i eth0 -w capture.pcap
```

이런 정보를 AI에게 제공하면, "재설치하세요" 대신 실제 원인에 가까운 답을 받을 수 있다.

### 14.6 AI 에이전트를 제대로 쓰는 법

#### 14.6.1 컨텍스트를 충분히 제공하라

AI에게 질문할 때 가장 중요한 것은 컨텍스트의 양과 질이다.

틀린 예: "카메라가 안 돼요"

맞는 예: "Ubuntu 22.04, ROS2 Humble, Intel RealSense D435, `rs-enumerate-devices`에서는 보이는데 `ros2 launch realsense2_camera rs_launch.py`하면 `Could not open device` 에러가 난다. Docker 안에서 실행 중이고, `--device=/dev/video0`은 매핑했다."

**AI에게 제공해야 할 정보 체크리스트**:
- OS 버전, ROS 버전
- 하드웨어 플랫폼 (x86 vs ARM/Jetson)
- 센서 모델명
- 에러 메시지 전문 (일부만 복사하지 말고 전체를 줘라)
- `ros2 topic list`, `ros2 node list` 출력
- Docker 사용 여부와 실행 옵션 (`docker run` 명령 전체)
- 네트워크 구성 (유선/무선, IP 대역)

#### 14.6.2 AI의 답을 검증하는 방법

AI의 답을 그대로 실행하기 전에 다음을 확인하라:

- **"이 패키지를 설치하라"** → 해당 패키지가 자기 ROS 버전과 Ubuntu 버전을 지원하는지 먼저 확인. `apt search ros-humble-<패키지명>`으로 존재 여부를 체크한다.
- **"이 설정을 바꿔라"** → 바꾸기 전에 현재 설정을 백업하고, 왜 바꿔야 하는지 근거를 AI에게 물어본다. 근거를 설명하지 못하면 의심하라.
- **"재설치하라"** → 90%는 재설치 안 해도 된다. 먼저 정확한 에러 원인을 좁혀라. `pip show`, `dpkg -l | grep`, `apt policy` 등으로 현재 상태를 확인하는 게 먼저다.
- **AI가 코드를 줄 때** → 하드코딩된 경로(`/home/user/...`), 하드코딩된 IP(`192.168.1.100`), x86 전용 패키지(`amd64` wheel) 등이 포함되어 있는지 확인한다.

#### 14.6.3 AI가 잘하는 것 vs 못하는 것

| AI가 잘하는 것 | AI가 못하는 것 |
|---|---|
| 알고리즘 구현 (SLAM, detection 등) | 하드웨어 디버깅 |
| ROS2 노드/서비스 코드 작성 | QoS/DDS 설정 최적화 |
| Python/C++ 코드 리팩토링 | USB/시리얼 권한 문제 |
| 논문 읽기/요약 | 네트워크 설정 (LiDAR IP 등) |
| CMakeLists.txt 작성 | 실시간 타이밍 문제 |
| 데이터 전처리 파이프라인 | Docker 안에서의 하드웨어 접근 |
| 시각화 코드 (matplotlib, Open3D) | 센서 간 시간 동기화 실전 |
| 에러 메시지 해석 (일반적인) | dmesg/커널 로그 기반 디버깅 |

결국 이런 구조다: AI는 "순수 소프트웨어" 영역에서는 강하지만, 하드웨어와 소프트웨어가 만나는 경계에서 약하다. 그리고 로보틱스 문제의 대부분이 그 경계에서 발생한다. AI가 강한 영역은 맡기고, AI가 약한 영역에서는 직접 디버깅한 결과를 AI에게 먹여서 분석하게 하는 게 맞다.

### 15.4 논문 읽기

#### 어떻게 읽을 것인가?

논문 읽기는 처음에 너무 어렵다. 2시간 걸려서 한 편 읽었는데 뭔 소린지 모르겠는 경험, 누구나 한다. 그래서 **3-패스 방법**을 추천한다:

1. **첫 번째 패스** (5-10분)
    - Title, Abstract, Conclusion
    - Figure, Table 훑어보기
    - 핵심 contribution 파악
    - 이 단계에서 "이 논문이 나에게 필요한가?"를 판단한다
2. **두 번째 패스** (1시간)
    - 전체 읽기 (수식 스킵 가능)
    - 방법론 이해
    - 관련 연구 파악
    - Figure를 꼼꼼히 보라 — 저자가 가장 공들인 곳이다
3. **세 번째 패스** (수 시간~며칠)
    - 수식 유도 따라가기
    - 코드 분석
    - 재구현 시도
    - 여기까지 오면 그 논문의 전문가

> 팁: 처음에는 일주일에 1편을 3-패스로 완전히 이해하는 게, 매일 1편을 대충 읽는 것보다 훨씬 낫다. 나중에 속도가 붙으면 자연스럽게 빨라진다.

### 15.8 연구 스킬

*대학원 수준.*

**15.8.1 논문 쓰기**
- 구조: Abstract → Introduction → Related Work → Method → Experiments → Conclusion
- Introduction 쓰는 법: (1) 문제 정의, (2) 기존 방법의 한계, (3) 우리의 접근, (4) contribution 목록
- 실험 섹션: baseline 비교, ablation study, 정성적 결과
- 흔한 실수: contribution이 불명확, 실험이 불공정한 비교, related work에서 핵심 논문 빠뜨림
- 팁: 논문을 쓰기 전에 figure/table을 먼저 그려라. 스토리가 잡힌다

**15.8.2 실험 설계와 Ablation Study**
- Ablation: 모델/시스템의 각 구성 요소를 하나씩 빼면서 기여도를 측정
- 변인 통제: 한 번에 하나만 바꿔라. 두 개 이상 동시에 바꾸면 어떤 것의 효과인지 모른다
- 통계적 유의성: 같은 실험을 여러 번(최소 3회) 반복하고 평균/표준편차 보고
- 공정한 비교: 같은 데이터, 같은 split, 같은 하드웨어에서 비교. 다른 논문의 숫자를 그대로 가져오면 조건이 다를 수 있다

**15.8.3 학회 발표**
- 발표 구조: 문제(1분) → 기존 한계(1분) → 제안 방법(3분) → 실험 결과(3분) → 결론(1분)
- 슬라이드: 글자 줄이고 그림/다이어그램 위주. 한 슬라이드에 하나의 메시지
- 포스터: 3m 거리에서 제목과 핵심 figure가 보여야 한다
- 데모 영상: 30초~1분. 처음에 결과 요약, 그 다음 상세

**15.8.4 논문 리뷰 (Peer Review)**
- 리뷰어 관점에서 체크할 것: novelty, technical soundness, experiments, clarity, reproducibility
- 건설적 피드백: "이 부분이 잘못됐다" 대신 "이 부분은 X를 추가하면 더 강해질 것 같다"
- Rebuttal 쓰기: 리뷰어의 핵심 우려를 하나씩 주소를 달아 답변. 감정적 대응 금지

**15.8.5 도구**
- LaTeX: Overleaf 또는 로컬 (texlive + vscode)
- 참고 문헌: Zotero + Better BibTeX → .bib 파일 자동 관리
- 파이프라인 그림: TikZ (정밀 제어), draw.io (빠른 제작), Inkscape (SVG 편집)
- 테이블: booktabs 패키지 (\toprule, \midrule, \bottomrule)
- 알고리즘: algorithm2e 패키지
- 수식: 표기법을 논문 전체에서 통일하라 (notation table 만들기)

#### A.2 용어

**Keyframe**: 중요 정보를 포함하는 선택된 프레임. 모든 프레임을 처리하면 너무 느리니까, 의미 있는 변화가 있는 프레임만 골라서 사용한다.

**Loop Closure**: 이전 방문 장소 재인식을 통한 드리프트 보정. "아, 여기 아까 왔던 곳이네" → 누적 오차를 한꺼번에 교정.

**Drift**: 오차의 누적. 100m를 걸어가면서 매 걸음마다 1cm씩 오차가 나면, 도착할 때는 100cm 오차가 된다.

**Reprojection Error**: 3D 점을 이미지에 재투영했을 때의 오차. "이 3D 점이 카메라 이미지 어디에 보여야 하는가"의 예측값과 실제값의 차이.

**Feature Descriptor**: 특징점 주변을 설명하는 벡터. 두 이미지에서 같은 점을 찾을 때, 이 벡터를 비교한다.

**Homography**: 평면 간의 변환. 책상 위를 찍은 두 사진을 정합할 때 사용.

**Essential Matrix**: 캘리브레이션된 카메라 쌍의 기하 관계. 5DoF(회전 3 + 이동 방향 2).

**Fundamental Matrix**: 캘리브레이션되지 않은 카메라 쌍의 기하 관계. 7DoF.

**Epipole**: 한 카메라의 중심이 다른 카메라 이미지에 투영된 점.

**Zero-shot**: 학습 없이 새로운 태스크 수행. "고양이"를 학습 안 했는데 "고양이 찾아줘"가 되는 것.

**Few-shot**: 적은 예제로 새로운 태스크 학습. 예시 3-5개만 주면 학습.

**Fine-tuning**: 사전학습 모델을 특정 태스크에 맞게 재학습. 대형 모델을 내 데이터에 맞게 조정.

**Domain Adaptation**: 소스 도메인에서 타겟 도메인으로 적응. 시뮬레이션에서 학습 → 실제 환경 적용.

**Sim-to-Real**: 시뮬레이션에서 실제 환경으로 전이. Domain Adaptation의 대표적 사례.

**Gaussian Splatting**: 3D 장면을 수백만 개의 3D 가우시안으로 표현하는 방법. NeRF보다 빠르고 편집 가능.

**Factor Graph**: 변수 간의 제약 조건을 그래프로 표현. SLAM 최적화의 핵심 자료구조.

**Knowledge Distillation**: 큰 모델(teacher)의 지식을 작은 모델(student)에 전달하는 기법.

### B. 자주 묻는 질문 (FAQ)

**Q: Python과 C++ 중 어떤 것을 먼저 배워야 하나요?**

A: Python을 먼저 권장한다. 대부분의 딥러닝 연구와 빠른 프로토타이핑에 Python이 사용된다. C++는 실시간 시스템이나 ROS 깊이 들어갈 때 배우면 된다. 참고로 ORB-SLAM3 같은 classical SLAM 코드는 C++로 되어 있으니, SLAM 연구를 하려면 결국 C++도 필요하다. 하지만 "먼저"는 Python이다.

**Q: GPU가 없으면 연구를 할 수 없나요?**

A: 간단한 실험은 CPU로 가능하다. 하지만 딥러닝 학습에는 GPU가 필수이다. Google Colab(무료)이나 연구실 서버를 활용하자. Colab 무료 버전으로도 YOLO fine-tuning 정도는 충분히 가능하다.

**Q: ROS1과 ROS2 중 어떤 것을 배워야 하나요?**

A: 새로 배운다면 ROS2를 권장한다. ROS1은 2025년에 공식 지원이 종료(EOL)되었다. 하지만 사용하려는 패키지가 ROS1만 지원하면 어쩔 수 없이 ROS1을 먼저 배울 수도 있다. 좋은 소식은, ROS1을 알면 ROS2는 금방 배운다는 것이다.

**Q: 논문을 어디서 찾나요?**

A: [arXiv](https://arxiv.org/) (무료 프리프린트 서버), [Google Scholar](https://scholar.google.com/) (논문 검색), [Papers With Code](https://paperswithcode.com/) (코드 포함 논문 검색)를 활용하자. 학회별로 보고 싶으면 [CVPR Open Access](https://openaccess.thecvf.com/)나 [IEEE Xplore](https://ieeexplore.ieee.org/)도 유용하다.

**Q: SLAM을 공부하려면 어디서 시작해야 하나요?**

A: Cyrill Stachniss의 [YouTube SLAM 강의](https://www.youtube.com/playlist?list=PLgnQpQtFTOGQrZ4O5QzbIHgl3b1JHimN_)로 시작하고, ORB-SLAM3 코드를 분석해보자. 그 전에 본 문서의 3장(카메라 모델)과 4장(Visual Odometry)을 읽으면 강의가 훨씬 잘 들릴 것이다.

**Q: 연구 아이디어는 어떻게 찾나요?**

A: 최신 학회 논문의 Limitation 섹션을 읽어보자. 해결되지 않은 문제에서 아이디어를 얻을 수 있다. 또 다른 방법은 두 분야를 결합하는 것이다 — 예: "3D Gaussian Splatting + Semantic SLAM"처럼 아직 합쳐지지 않은 것을 합치는 시도.

**Q: 어떤 GPU를 사야 하나요?**

A: 개인 연구용이라면 **NVIDIA RTX 4070 Ti Super** (16GB VRAM) 이상을 추천한다. VRAM이 가장 중요한 스펙인데, 12GB는 요즘 VFM 모델 돌리기에 빠듯하고, 16GB면 대부분 커버 가능하다. 예산이 넉넉하면 RTX 4090 (24GB)이 최고이지만, 가성비를 따지면 4070 Ti Super가 좋다. AMD GPU는 PyTorch 지원이 아직 NVIDIA만큼 안정적이지 않아서 비추한다. 연구실 서버가 있다면 개인 GPU는 굳이 없어도 되니, 서버 사양을 먼저 확인하자.

**Q: 논문은 하루에 몇 편 읽어야 하나요?**

A: "하루에 N편" 같은 기준은 의미 없다. 처음에는 **일주일에 1편을 완벽하게** 이해하는 게 훨씬 낫다. 위 15.4의 3-패스 방법을 따라서, 한 편을 깊이 파고들자. 6개월쯤 지나면 Abstract만 봐도 "아, 이런 류의 논문이구나" 감이 온다. 그때부터 속도가 붙는다. 참고로, 랩미팅 발표를 위해 논문을 읽는 것과 자기 연구를 위해 읽는 것은 깊이가 다르다. 후자는 코드까지 분석해야 한다.

**Q: 코딩을 잘 못하는데 연구를 할 수 있나요?**

A: 할 수 있다. 다만, 피할 수는 없다 — 코딩은 연구의 도구이기 때문이다. 좋은 소식은, 연구에 필요한 코딩은 "알고리즘 대회 수준의 코딩"과는 다르다는 점이다. 연구에서는 PyTorch 코드를 수정하고, 데이터 로더를 만들고, 실험 결과를 시각화하는 능력이 중요하다. 이건 연습하면 누구나 할 수 있다. 처음에는 기존 코드를 "복붙 → 수정 → 이해" 순서로 접근하면 된다. 6개월이면 충분히 기초가 잡힌다.

**Q: 학회 발표는 어떻게 준비하나요?**

A: 학회 발표는 크게 **구두 발표(oral)**와 **포스터 발표(poster)**로 나뉜다.

- **포스터**: 대부분의 첫 발표는 포스터다. A0 크기로 연구 내용을 요약한다. 핵심은 **Figure를 크게, 텍스트를 적게**. 지나가는 사람이 3초 안에 관심을 가지게 해야 한다. 발표 연습은 연구실 동료들 앞에서 최소 3번은 하자.
- **구두 발표**: 보통 15-20분이다. 슬라이드는 20장 이내, 한 슬라이드에 한 메시지. 데모 영상이 있으면 좋다. 질문에 대비해서 supplementary 슬라이드도 준비하자.
- 공통: 영어 발표가 대부분이니, 스크립트를 써서 연습하되 외우지는 말자. 자연스러운 영어보다 내용 전달이 중요하다.

**Q: 영어 논문 읽기가 너무 힘든데요?**

A: 이건 정말 시간이 해결해준다. 몇 가지 팁:

- **구조를 먼저 파악하라**: 대부분의 논문은 Introduction → Related Work → Method → Experiments → Conclusion 구조다. Method만 진짜 새로운 내용이고, 나머지는 패턴이 비슷하다.
- **분야별 어휘를 먼저 익혀라**: "ablation study", "state-of-the-art", "we empirically show" 같은 표현은 반복된다. 처음 20편쯤 읽으면 이런 표현에 익숙해진다.
- **번역 도구를 부끄러워하지 마라**: DeepL, Google Translate로 모르는 문장을 번역하는 건 전혀 부끄러운 일이 아니다. 다만, 번역에만 의존하면 영어 실력이 안 는다. "원문 → 번역 확인 → 다시 원문" 순서로 읽자.
- **PDF 리더에서 형광펜을 활용하라**: 핵심 문장을 색칠하면서 읽으면 집중도가 올라간다. Zotero + PDF 뷰어 조합을 추천한다.

### C. 트러블슈팅 가이드

#### C.1 CUDA / PyTorch 관련

**문제**: `CUDA out of memory`

**해결**:

```python
# 1. 배치 사이즈 줄이기 (가장 먼저 시도)
batch_size = 16  # → 8 또는 4

# 2. 메모리 정리
torch.cuda.empty_cache()

# 3. Gradient accumulation 사용 (배치 효과는 유지하면서 메모리 절약)
accumulation_steps = 4
for i, (inputs, labels) in enumerate(dataloader):
    loss = model(inputs, labels) / accumulation_steps
    loss.backward()
    if (i + 1) % accumulation_steps == 0:
        optimizer.step()
        optimizer.zero_grad()

# 4. Mixed Precision Training (메모리 절반으로)
from torch.cuda.amp import autocast, GradScaler
scaler = GradScaler()
with autocast():
    output = model(input)
    loss = criterion(output, target)
```

**문제**: `CUDA version mismatch`

**해결**:

```bash
# 설치된 CUDA 버전 확인
nvcc --version

# PyTorch에서 인식하는 CUDA 버전 확인
python -c "import torch; print(torch.version.cuda)"

# 둘이 다르면 PyTorch 재설치 (CUDA 버전에 맞춰서)
pip install torch --index-url https://download.pytorch.org/whl/cu121
```

**문제**: `RuntimeError: CUDA error: device-side assert triggered`

**해결**: 이건 보통 라벨 인덱스가 범위를 벗어났을 때 발생한다. CPU에서 돌려보면 더 자세한 에러 메시지가 나온다.

```bash
CUDA_LAUNCH_BLOCKING=1 python train.py
```

#### C.2 ROS 관련

**문제**: `Package not found`

**해결**:

```bash
# Workspace 소싱 확인
source ~/ros2_ws/install/setup.bash

# 패키지 설치 확인
ros2 pkg list | grep package_name

# .bashrc에 소싱 추가 (매번 수동으로 안 해도 됨)
echo "source ~/ros2_ws/install/setup.bash" >> ~/.bashrc
```

**문제**: `TF tree not connected`

**해결**:

```bash
# TF 트리 확인
ros2 run tf2_tools view_frames

# Static transform 추가 (예시)
ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 base_link camera_link
```

**문제**: `Topic not published` / 데이터가 안 들어옴

**해결**:

```bash
# 현재 활성 토픽 확인
ros2 topic list

# 특정 토픽 데이터 확인
ros2 topic echo /camera/image_raw --once

# QoS 설정 불일치 확인 (ROS2에서 흔한 문제)
ros2 topic info /camera/image_raw -v
```

#### C.3 Docker 관련

**문제**: `Permission denied`

**해결**:

```bash
# 도커 그룹에 사용자 추가
sudo usermod -aG docker $USER
# 로그아웃 후 재로그인
```

**문제**: GUI 프로그램 실행 안 됨

**해결**:

```bash
# X11 forwarding
xhost +local:docker
docker run -it --env DISPLAY=$DISPLAY -v /tmp/.X11-unix:/tmp/.X11-unix ...
```

**문제**: Docker 안에서 GPU가 안 잡힘

**해결**:

```bash
# nvidia-container-toolkit 설치
sudo apt-get install -y nvidia-container-toolkit
sudo systemctl restart docker

# GPU 옵션 추가해서 실행
docker run --gpus all -it nvidia/cuda:12.1.0-base-ubuntu22.04 nvidia-smi
```

#### C.4 OpenCV 관련

**문제**: `cv2.imshow() not working`

**해결**:

```bash
# OpenCV headless 버전 제거 후 재설치
pip uninstall opencv-python-headless
pip install opencv-python
```

**문제**: OpenCV와 ROS의 cv_bridge 충돌

**해결**:

```bash
# ROS의 cv_bridge가 시스템 OpenCV를 참조하는 경우
# conda/venv 환경의 OpenCV와 충돌할 수 있다
# 해결: ROS workspace 빌드 시 Python 경로 명시

colcon build --cmake-args -DPython3_EXECUTABLE=/usr/bin/python3
```

#### C.5 빌드/컴파일 관련

**문제**: ORB-SLAM3 빌드 에러 (OpenCV 버전 충돌)

**해결**:

```bash
# OpenCV 4.x에서는 일부 API가 변경됨
# CMakeLists.txt에서 OpenCV 버전 확인
find_package(OpenCV 4 REQUIRED)

# Pangolin 빌드 에러 시
sudo apt-get install libglew-dev libpython2.7-dev
```

**문제**: Eigen 버전 관련 에러

**해결**:

```bash
# 시스템 Eigen 버전 확인
pkg-config --modversion eigen3

# 특정 버전 필요 시 직접 설치
sudo apt-get install libeigen3-dev
```

#### 생존을 위한 마인드셋

1. **모르는 건 당연하다**: 3학년 학부생이 SLAM을 모르는 건 당연하다. 부끄러워하지 말고 물어보자.
2. **선배를 활용하라**: 선배들은 같은 고통을 겪었기에 도와주고 싶어한다. 다만, "제가 이것저것 해봤는데 안 돼요"라고 해야지, "이거 해주세요"라고 하면 안 된다.
3. **기록하라**: 오늘 뭘 했는지, 뭘 모르겠는지, 어떤 에러가 났는지 기록해두자. 나중에 같은 문제를 만났을 때 과거의 내가 도와준다.
4. **작게 시작하라**: 거대한 시스템을 이해하려 하지 말고, 작은 코드 조각부터 돌려보자. "이 함수가 뭘 하는지" 하나만 이해해도 진전이다.
5. **비교하지 마라**: 선배가 논문을 술술 읽는 건 그만큼 시간을 투자했기 때문이다. 3개월 후의 나는 지금보다 훨씬 잘할 것이다.

## 마무리: 어디서부터 시작할까?

학습 순서는 **15.7절의 학습 경로**를 기준으로 진행하면 된다. 막히면 이 문서의 해당 섹션을 다시 참고하고, 그래도 해결이 안 되면 선배나 연구실 Slack에 질문하자. 14장에서는 AI 코딩 에이전트와 협업할 때 주의할 점을 정리했으니 참고하라.

이 문서는 지속적으로 업데이트할 예정이다.

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function() {
  'use strict';

  // ---- Marked configuration ----
  marked.setOptions({
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, { language: lang }).value; } catch(e) {}
      }
      try { return hljs.highlightAuto(code).value; } catch(e) {}
      return code;
    },
    breaks: false,
    gfm: true
  });

  // ---- Render markdown ----
  const mdSource = document.getElementById('md-source').value;
  const contentEl = document.getElementById('content');
  const loadingEl = document.getElementById('loading');

  // Use requestAnimationFrame to let the spinner show first
  requestAnimationFrame(function() {
    const html = marked.parse(mdSource);
    contentEl.innerHTML = html;
    contentEl.style.display = 'block';
    loadingEl.style.display = 'none';

    // Embed interactive demos inline
    embedDemos();
    // Add IDs to headings and build TOC
    buildTOC();
    // Setup scroll tracking
    setupScrollTracking();
    // Setup search
    setupSearch();
    // Setup progress bar
    setupProgressBar();
    // Setup mobile menu
    setupMobileMenu();
    // Setup keyboard shortcut
    setupKeyboard();
  });

  // ---- Build Table of Contents ----
  function buildTOC() {
    const headings = contentEl.querySelectorAll('h2, h3');
    const tocContainer = document.getElementById('toc-container');
    const fragment = document.createDocumentFragment();

    headings.forEach(function(heading, index) {
      // Create ID from heading text
      let id = heading.id;
      if (!id) {
        id = 'section-' + index + '-' + heading.textContent
          .toLowerCase()
          .replace(/[^\w\s가-힣-]/g, '')
          .replace(/\s+/g, '-')
          .substring(0, 60);
        heading.id = id;
      }

      const link = document.createElement('a');
      link.className = 'toc-item toc-' + heading.tagName.toLowerCase();
      link.href = '#' + id;
      link.textContent = heading.textContent;
      link.dataset.headingId = id;

      link.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.getElementById(id);
        if (target) {
          const offset = 60;
          const top = target.getBoundingClientRect().top + window.scrollY - offset;
          window.scrollTo({ top: top, behavior: 'smooth' });
        }
        // Close mobile sidebar
        closeMobileSidebar();
      });

      fragment.appendChild(link);
    });

    tocContainer.appendChild(fragment);
  }

  // ---- Scroll tracking with IntersectionObserver ----
  function setupScrollTracking() {
    const headings = contentEl.querySelectorAll('h2, h3');
    const tocItems = document.querySelectorAll('.toc-item');
    if (headings.length === 0) return;

    // Map heading IDs to toc items
    const tocMap = {};
    tocItems.forEach(function(item) {
      tocMap[item.dataset.headingId] = item;
    });

    let currentActive = null;

    const observer = new IntersectionObserver(function(entries) {
      // Find the topmost visible heading
      let topHeading = null;
      let topOffset = Infinity;

      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          const rect = entry.target.getBoundingClientRect();
          if (rect.top < topOffset) {
            topOffset = rect.top;
            topHeading = entry.target;
          }
        }
      });

      if (topHeading) {
        if (currentActive) currentActive.classList.remove('active');
        const item = tocMap[topHeading.id];
        if (item) {
          item.classList.add('active');
          currentActive = item;
          // Scroll TOC to show active item
          const tocContainer = document.getElementById('toc-container');
          const itemRect = item.getBoundingClientRect();
          const containerRect = tocContainer.getBoundingClientRect();
          if (itemRect.top < containerRect.top || itemRect.bottom > containerRect.bottom) {
            item.scrollIntoView({ block: 'center', behavior: 'smooth' });
          }
        }
      }
    }, {
      rootMargin: '-60px 0px -70% 0px',
      threshold: 0
    });

    headings.forEach(function(h) { observer.observe(h); });

    // Also track via scroll for better accuracy
    let ticking = false;
    window.addEventListener('scroll', function() {
      if (!ticking) {
        requestAnimationFrame(function() {
          updateActiveFromScroll(headings, tocMap);
          ticking = false;
        });
        ticking = true;
      }
    });

    function updateActiveFromScroll(headings, tocMap) {
      let found = null;
      const scrollTop = window.scrollY + 80;

      for (let i = headings.length - 1; i >= 0; i--) {
        if (headings[i].offsetTop <= scrollTop) {
          found = headings[i];
          break;
        }
      }

      if (found) {
        if (currentActive) currentActive.classList.remove('active');
        const item = tocMap[found.id];
        if (item) {
          item.classList.add('active');
          currentActive = item;
        }
      }
    }
  }

  // ---- Search ----
  function setupSearch() {
    const searchInput = document.getElementById('search-input');
    const tocItems = document.querySelectorAll('.toc-item');
    const noResults = document.getElementById('toc-no-results');

    searchInput.addEventListener('input', function() {
      const query = this.value.trim().toLowerCase();

      if (!query) {
        tocItems.forEach(function(item) { item.classList.remove('toc-hidden'); });
        noResults.style.display = 'none';
        return;
      }

      let matchCount = 0;
      tocItems.forEach(function(item) {
        const text = item.textContent.toLowerCase();
        if (text.includes(query)) {
          item.classList.remove('toc-hidden');
          matchCount++;
        } else {
          item.classList.add('toc-hidden');
        }
      });

      noResults.style.display = matchCount === 0 ? 'block' : 'none';
    });
  }

  // ---- Progress bar ----
  function setupProgressBar() {
    const progressBar = document.getElementById('progress-bar');
    let ticking = false;

    function updateProgress() {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      progressBar.style.width = Math.min(progress, 100) + '%';
    }

    window.addEventListener('scroll', function() {
      if (!ticking) {
        requestAnimationFrame(function() {
          updateProgress();
          ticking = false;
        });
        ticking = true;
      }
    });

    updateProgress();
  }

  // ---- Mobile menu ----
  function setupMobileMenu() {
    const toggle = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.querySelector('#sidebar-overlay');

    toggle.addEventListener('click', function() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('visible');
    });

    overlay.addEventListener('click', closeMobileSidebar);
  }

  function closeMobileSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.querySelector('#sidebar-overlay').classList.remove('visible');
  }

  // ---- Keyboard shortcut ----
  function setupKeyboard() {
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('search-input').focus();
      }
    });
  }

  // ---- Embed interactive demos inline ----
  function embedDemos() {
    // Map of hash keys to demo files and display names
    var demoMap = {
      'canny_edge':          { file: 'interactive/canny_edge.html',          name: 'Canny Edge Detection' },
      'lens_distortion':     { file: 'interactive/lens_distortion.html',     name: 'Lens Distortion' },
      'feature_matching':    { file: 'interactive/feature_matching.html',    name: 'Feature Matching' },
      'ransac':              { file: 'interactive/ransac.html',              name: 'RANSAC' },
      'm_estimator':         { file: 'interactive/m_estimator.html',         name: 'M-Estimator' },
      'rotation_gimbal':     { file: 'interactive/rotation_gimbal.html',     name: '회전 표현과 Gimbal Lock' },
      'pose_composition_3d': { file: 'interactive/pose_composition_3d.html', name: 'SE(3) Pose Composition' },
      'se2_odometry':        { file: 'interactive/se2_odometry.html',        name: 'SE(2) Odometry' },
      'odom_uncertainty':    { file: 'interactive/odom_uncertainty.html',     name: 'Odometry Uncertainty' },
      'xyzrpy_6dof':         { file: 'interactive/xyzrpy_6dof.html',        name: '6DoF 포즈 시각화' },
      'robot_arm_fk':        { file: 'interactive/robot_arm_fk.html',        name: 'Robot Arm FK' },
      'icp_steps':           { file: 'interactive/icp_steps.html',           name: 'ICP 2D' },
      'icp_3d':              { file: 'interactive/icp_3d.html',              name: 'ICP 3D' },
      'pose_graph':          { file: 'interactive/pose_graph.html',          name: 'Pose Graph Optimization' },
      'kalman_filter':       { file: 'interactive/kalman_filter.html',       name: 'Kalman Filter' },
      'particle_filter':     { file: 'interactive/particle_filter.html',     name: 'Particle Filter' },
      'homography':          { file: 'interactive/homography.html',          name: 'Homography' },
      'epipolar':            { file: 'interactive/epipolar.html',            name: 'Epipolar Geometry' },
      'optical_flow':        { file: 'interactive/optical_flow.html',        name: 'Optical Flow' },
      'stereo_disparity':    { file: 'interactive/stereo_disparity.html',    name: 'Stereo Disparity' },
      'occupancy_grid':      { file: 'interactive/occupancy_grid.html',      name: 'Occupancy Grid' },
      'camera_projection':   { file: 'interactive/camera_projection.html',   name: 'Camera Projection' },
      'convolution':         { file: 'interactive/convolution.html',         name: 'Convolution' },
      'bundle_adjustment':   { file: 'interactive/bundle_adjustment.html',   name: 'Bundle Adjustment' },
      'gaussian_splatting':  { file: 'interactive/gaussian_splatting.html',  name: '3D Gaussian Splatting' },
      'factor_graph_viz':    { file: 'interactive/factor_graph_viz.html',    name: 'Factor Graph' },
      'bev_projection':      { file: 'interactive/bev_projection.html',      name: 'BEV Projection' },
      'data_augmentation':   { file: 'interactive/data_augmentation.html',   name: 'Data Augmentation' },
      'lr_schedule':         { file: 'interactive/lr_schedule.html',         name: 'LR Schedule' },
      'hf_sam':              { file: 'interactive/hf_sam.html',              name: 'SAM2 Interactive Segmentation' },
      'hf_depth':            { file: 'interactive/hf_depth.html',            name: 'Depth Anything V2' },
      'hf_grounding_dino':   { file: 'interactive/hf_grounding_dino.html',   name: 'Grounding DINO' }
    };

    // Find all blockquotes in the rendered content
    var blockquotes = contentEl.querySelectorAll('blockquote');

    blockquotes.forEach(function(bq) {
      var firstP = bq.querySelector('p');
      if (!firstP) return;

      var firstStrong = firstP.querySelector('strong');
      if (!firstStrong) return;

      // Check if the bold text starts with "실습"
      var strongText = firstStrong.textContent.trim();
      if (strongText.indexOf('실습') !== 0) return;

      // Find all links with app.html# pattern in this blockquote
      var links = bq.querySelectorAll('a[href*="app.html#"]');
      if (links.length === 0) return;

      // Extract demo info from links
      var demos = [];
      links.forEach(function(link) {
        var href = link.getAttribute('href');
        var hashMatch = href.match(/#(\w+)$/);
        if (hashMatch && demoMap[hashMatch[1]]) {
          demos.push({
            key: hashMatch[1],
            label: link.textContent.trim(),
            file: demoMap[hashMatch[1]].file
          });
        }
      });

      if (demos.length === 0) return;

      // Extract the description text (second line of blockquote, after the link line)
      var allPs = bq.querySelectorAll('p');
      var description = '';
      // The description might be in the second <p>, or in the same <p> after a <br>
      // Let's check for text after the links in the last <p>
      if (allPs.length > 1) {
        description = allPs[allPs.length - 1].textContent.trim();
      } else if (allPs.length === 1) {
        // Description may be part of the same paragraph - look for text content after links
        // Clone the paragraph and remove the strong and links to get remaining text
        var clone = firstP.cloneNode(true);
        var strongClone = clone.querySelector('strong');
        if (strongClone) strongClone.remove();
        var linkClones = clone.querySelectorAll('a');
        linkClones.forEach(function(l) { l.remove(); });
        description = clone.textContent.replace(/[|:]/g, '').trim();
      }

      // Build the demo container
      var container = document.createElement('div');
      container.className = 'demo-container';

      // Build header text
      var headerLabel = demos.map(function(d) { return d.label; }).join(' / ');
      var headerText = '\u25B6 \uC2E4\uC2B5: ' + headerLabel;
      if (description) {
        headerText += ' \u2014 ' + description;
      }
      headerText += ' (\uD074\uB9AD\uD558\uC5EC \uC5F4\uAE30)';

      var header = document.createElement('div');
      header.className = 'demo-header';
      header.setAttribute('role', 'button');
      header.setAttribute('tabindex', '0');
      header.dataset.demos = JSON.stringify(demos);
      header.dataset.headerLabel = headerLabel;
      header.dataset.description = description;

      var titleSpan = document.createElement('span');
      titleSpan.className = 'demo-title';
      titleSpan.textContent = headerText;
      header.appendChild(titleSpan);

      var fsBtn = document.createElement('button');
      fsBtn.className = 'demo-fullscreen-btn';
      fsBtn.textContent = '\u2922 전체 화면';
      fsBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        var cont = this.closest('.demo-container');
        cont.classList.toggle('fullscreen');
        if (cont.classList.contains('fullscreen')) {
          this.textContent = '\u2716 닫기';
          document.body.style.overflow = 'hidden';
        } else {
          this.textContent = '\u2922 전체 화면';
          document.body.style.overflow = '';
        }
      });
      header.appendChild(fsBtn);

      header.addEventListener('click', function(e) {
        if (e.target.classList.contains('demo-fullscreen-btn')) return;
        toggleDemo(this);
      });
      header.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleDemo(this);
        }
      });

      container.appendChild(header);

      // Build body
      var body = document.createElement('div');
      body.className = 'demo-body collapsed';

      if (demos.length === 1) {
        // Single demo - simple iframe
        var iframe = document.createElement('iframe');
        iframe.setAttribute('data-src', demos[0].file);
        iframe.setAttribute('width', '100%');
        iframe.setAttribute('height', '700');
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('loading', 'lazy');
        iframe.setAttribute('title', demos[0].label);
        body.appendChild(iframe);
      } else {
        // Multiple demos - tabbed interface
        var tabBar = document.createElement('div');
        tabBar.className = 'demo-tabs';

        demos.forEach(function(demo, idx) {
          var tabBtn = document.createElement('button');
          tabBtn.className = 'demo-tab' + (idx === 0 ? ' active' : '');
          tabBtn.textContent = demo.label;
          tabBtn.dataset.demoKey = demo.key;
          tabBtn.dataset.demoFile = demo.file;
          tabBtn.addEventListener('click', function() {
            switchTab(this);
          });
          tabBar.appendChild(tabBtn);
        });

        body.appendChild(tabBar);

        // iframe for the first (active) demo
        var iframe = document.createElement('iframe');
        iframe.setAttribute('data-src', demos[0].file);
        iframe.setAttribute('width', '100%');
        iframe.setAttribute('height', '700');
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('loading', 'lazy');
        iframe.setAttribute('title', demos[0].label);
        iframe.dataset.demoKey = demos[0].key;
        body.appendChild(iframe);
      }

      container.appendChild(body);

      // Replace the blockquote with the demo container
      bq.parentNode.replaceChild(container, bq);
    });
  }

  // ---- Toggle demo open/closed ----
  function toggleDemo(headerEl) {
    var body = headerEl.nextElementSibling;
    var demos = JSON.parse(headerEl.dataset.demos);
    var headerLabel = headerEl.dataset.headerLabel;
    var description = headerEl.dataset.description;
    var isOpen = !body.classList.contains('collapsed');

    if (isOpen) {
      // Close
      body.style.maxHeight = body.scrollHeight + 'px';
      // Force reflow
      body.offsetHeight;
      body.classList.remove('expanded');
      body.classList.add('collapsed');
      var closeText = '\u25B6 \uC2E4\uC2B5: ' + headerLabel;
      if (description) closeText += ' \u2014 ' + description;
      closeText += ' (\uD074\uB9AD\uD558\uC5EC \uC5F4\uAE30)';
      var titleEl = headerEl.querySelector('.demo-title');
      if (titleEl) titleEl.textContent = closeText;
      else headerEl.textContent = closeText;
    } else {
      // Open - lazy load iframe if needed
      var iframe = body.querySelector('iframe');
      if (iframe && !iframe.getAttribute('src') && iframe.getAttribute('data-src')) {
        iframe.setAttribute('src', iframe.getAttribute('data-src'));
      }

      body.classList.remove('collapsed');
      body.style.maxHeight = '0px';
      // Force reflow
      body.offsetHeight;
      // Set to actual height for animation
      var targetHeight = 700 + 10; // iframe height + some padding
      var tabs = body.querySelector('.demo-tabs');
      if (tabs) targetHeight += tabs.offsetHeight || 40;
      body.style.maxHeight = targetHeight + 'px';
      body.classList.add('expanded');

      // After transition, remove max-height constraint so it can adapt
      setTimeout(function() {
        if (!body.classList.contains('collapsed')) {
          body.style.maxHeight = 'none';
        }
      }, 450);

      var openText = '\u25BC \uC2E4\uC2B5: ' + headerLabel;
      if (description) openText += ' \u2014 ' + description;
      openText += ' (\uD074\uB9AD\uD558\uC5EC \uB2EB\uAE30)';
      var titleEl2 = headerEl.querySelector('.demo-title');
      if (titleEl2) titleEl2.textContent = openText;
      else headerEl.textContent = openText;
    }
  }

  // ---- Switch tabs in multi-demo containers ----
  function switchTab(tabBtn) {
    var tabBar = tabBtn.parentElement;
    var body = tabBar.parentElement;
    var demoFile = tabBtn.dataset.demoFile;
    var demoKey = tabBtn.dataset.demoKey;

    // Update active tab
    var allTabs = tabBar.querySelectorAll('.demo-tab');
    allTabs.forEach(function(t) { t.classList.remove('active'); });
    tabBtn.classList.add('active');

    // Update iframe
    var iframe = body.querySelector('iframe');
    if (iframe) {
      iframe.dataset.demoKey = demoKey;
      iframe.setAttribute('data-src', demoFile);
      iframe.setAttribute('src', demoFile);
      iframe.setAttribute('title', tabBtn.textContent);
    }
  }

})();
</script>
