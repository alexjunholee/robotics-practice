<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="stylesheet" href="../shared/theme.css">
<meta charset="UTF-8">
<title>이미지 필터링 (Convolution)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #ffffff; color: #1d1d1f; font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', system-ui, sans-serif; padding: 15px; }
h1 { text-align: center; color: #0071e3; font-size: 1.5em; margin-bottom: 3px; }
.subtitle { text-align: center; color: rgba(0,0,0,0.56); font-size: 0.85em; margin-bottom: 12px; }
.layout { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
.left-col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.canvas-pair { display: flex; gap: 10px; }
.canvas-box { text-align: center; }
.canvas-box canvas { border: 1px solid rgba(0,0,0,0.16); border-radius: 5px; }
.canvas-box .lbl { font-size: 0.78em; color: rgba(0,0,0,0.48); margin-top: 4px; }
.right-col { display: flex; flex-direction: column; gap: 10px; width: 300px; }
.panel { background: #f5f5f7; padding: 12px; border-radius: 10px; }
.panel h3 { color: #0071e3; font-size: 0.95em; margin-bottom: 8px; }
.kernel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 10px; }
.kernel-grid input { width: 100%; text-align: center; background: #f5f5f7; border: 1px solid rgba(0,0,0,0.16); color: #1d1d1f; padding: 6px 2px; border-radius: 4px; font-size: 0.9em; font-family: 'Courier New', monospace; }
.kernel-grid input:focus { border-color: #0071e3; outline: none; }
.presets { display: flex; flex-wrap: wrap; gap: 5px; }
.presets button { background: #f5f5f7; color: #1d1d1f; border: 1px solid rgba(0,0,0,0.16); padding: 5px 9px; border-radius: 5px; cursor: pointer; font-size: 0.75em; transition: all 0.2s; }
.presets button:hover { background: #0071e3; color: #ffffff; border-color: #0071e3; }
.presets button.active { background: #0071e3; color: #ffffff; border-color: #0071e3; }
.toggle-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 0.82em; }
.toggle-row input { accent-color: #0071e3; }
.stats { font-size: 0.82em; margin-top: 8px; }
.stats .row { display: flex; justify-content: space-between; margin-bottom: 3px; }
.stats .row span:last-child { color: #0071e3; font-weight: bold; }
.kernel-display { font-family: 'Courier New', monospace; font-size: 0.8em; text-align: center; color: rgba(0,0,0,0.56); margin-top: 5px; }
</style>
</head>
<body>
<h1>이미지 필터링 (Convolution)</h1>
<p class="subtitle">2D Convolution - 커널 기반 이미지 처리</p>

<div class="layout">
  <div class="left-col">
    <div class="canvas-pair">
      <div class="canvas-box">
        <canvas id="srcCanvas" width="300" height="300"></canvas>
        <div class="lbl">원본 이미지 (Original)</div>
      </div>
      <div class="canvas-box">
        <canvas id="dstCanvas" width="300" height="300"></canvas>
        <div class="lbl">필터 결과 (Filtered Result)</div>
      </div>
    </div>
  </div>

  <div class="right-col">
    <div class="panel">
      <h3>커널 편집 (Edit Kernel 3x3)</h3>
      <div class="kernel-grid" id="kernelGrid"></div>
      <div class="toggle-row">
        <input type="checkbox" id="normalize">
        <label for="normalize">정규화 (Normalize by kernel sum)</label>
      </div>
      <div class="stats">
        <div class="row"><span>커널 합 (Kernel Sum):</span><span id="kernelSum">1</span></div>
        <div class="row"><span>출력 최소값 (Output Min):</span><span id="outMin">0</span></div>
        <div class="row"><span>출력 최대값 (Output Max):</span><span id="outMax">255</span></div>
        <div class="row"><span>처리 시간 (Time):</span><span id="procTime">-</span></div>
      </div>
    </div>

    <div class="panel">
      <h3>프리셋 커널 (Preset Kernels)</h3>
      <div class="presets" id="presets"></div>
    </div>
  </div>
</div>

<script>
const W = 300, H = 300;
const srcCanvas = document.getElementById('srcCanvas');
const dstCanvas = document.getElementById('dstCanvas');
const srcCtx = srcCanvas.getContext('2d');
const dstCtx = dstCanvas.getContext('2d');

const presets = {
  'Identity': [0,0,0, 0,1,0, 0,0,0],
  'Gaussian Blur': [1,2,1, 2,4,2, 1,2,1],
  'Sharpen': [0,-1,0, -1,5,-1, 0,-1,0],
  'Edge (Laplacian)': [0,-1,0, -1,4,-1, 0,-1,0],
  'Sobel X': [-1,0,1, -2,0,2, -1,0,1],
  'Sobel Y': [-1,-2,-1, 0,0,0, 1,2,1],
  'Emboss': [-2,-1,0, -1,1,1, 0,1,2],
  'Box Blur': [1,1,1, 1,1,1, 1,1,1],
};

let kernel = [0,0,0, 0,1,0, 0,0,0];

function generateSourceImage() {
  const img = srcCtx.createImageData(W, H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const idx = (y * W + x) * 4;
      let v = 40;
      // Gradient background
      v = 30 + (x / W) * 60 + (y / H) * 40;
      // Checkerboard
      if ((Math.floor(x / 30) + Math.floor(y / 30)) % 2 === 0) v += 30;
      // Circles
      const dx1 = x - 80, dy1 = y - 80;
      if (dx1*dx1 + dy1*dy1 < 40*40) v = 200;
      if (dx1*dx1 + dy1*dy1 < 20*20) v = 60;
      // Rectangle with edge
      if (x > 160 && x < 250 && y > 50 && y < 130) v = 180;
      if (x > 170 && x < 240 && y > 60 && y < 120) v = 80;
      // Diagonal lines
      if (Math.abs((x - y) % 40) < 2 && y > 150 && x < 150) v = 220;
      // Gradient circle
      const dx2 = x - 220, dy2 = y - 220;
      const r2 = Math.sqrt(dx2*dx2 + dy2*dy2);
      if (r2 < 60) v = 50 + (r2 / 60) * 200;
      // Star pattern
      const dx3 = x - 80, dy3 = y - 220;
      const a3 = Math.atan2(dy3, dx3);
      const r3 = Math.sqrt(dx3*dx3 + dy3*dy3);
      if (r3 < 40 + 15 * Math.sin(a3 * 5)) v = 210;
      // Random noise dots
      if (Math.random() < 0.01) v += (Math.random() - 0.5) * 100;

      v = Math.max(0, Math.min(255, v));
      img.data[idx] = v;
      img.data[idx+1] = v;
      img.data[idx+2] = v;
      img.data[idx+3] = 255;
    }
  }
  srcCtx.putImageData(img, 0, 0);
  return img;
}

let srcImage = generateSourceImage();

function buildKernelGrid() {
  const grid = document.getElementById('kernelGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.step = 'any';
    inp.value = kernel[i];
    inp.dataset.idx = i;
    inp.addEventListener('input', () => {
      kernel[i] = parseFloat(inp.value) || 0;
      applyConvolution();
    });
    grid.appendChild(inp);
  }
}

function setKernel(values) {
  kernel = [...values];
  const inputs = document.querySelectorAll('#kernelGrid input');
  inputs.forEach((inp, i) => inp.value = kernel[i]);
  applyConvolution();
}

function buildPresets() {
  const container = document.getElementById('presets');
  for (const [name, vals] of Object.entries(presets)) {
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.addEventListener('click', () => {
      container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setKernel(vals);
    });
    container.appendChild(btn);
  }
}

function applyConvolution() {
  const t0 = performance.now();
  const src = srcCtx.getImageData(0, 0, W, H);
  const dst = dstCtx.createImageData(W, H);
  const norm = document.getElementById('normalize').checked;
  let kSum = kernel.reduce((a, b) => a + b, 0);
  if (kSum === 0) kSum = 1;
  const divisor = norm ? kSum : 1;

  let outMin = Infinity, outMax = -Infinity;

  // First pass: compute raw values
  const raw = new Float32Array(W * H);
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      let sum = 0;
      for (let ky = -1; ky <= 1; ky++) {
        for (let kx = -1; kx <= 1; kx++) {
          const si = ((y + ky) * W + (x + kx)) * 4;
          const ki = (ky + 1) * 3 + (kx + 1);
          sum += src.data[si] * kernel[ki];
        }
      }
      if (divisor !== 0) sum /= divisor;
      raw[y * W + x] = sum;
      if (sum < outMin) outMin = sum;
      if (sum > outMax) outMax = sum;
    }
  }

  // Second pass: map to 0-255
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const di = (y * W + x) * 4;
      let v;
      if (y === 0 || y === H-1 || x === 0 || x === W-1) {
        v = src.data[di];
      } else {
        v = raw[y * W + x];
        v = Math.max(0, Math.min(255, v));
      }
      dst.data[di] = v;
      dst.data[di+1] = v;
      dst.data[di+2] = v;
      dst.data[di+3] = 255;
    }
  }
  dstCtx.putImageData(dst, 0, 0);
  const t1 = performance.now();

  document.getElementById('kernelSum').textContent = kernel.reduce((a,b) => a+b, 0).toFixed(2);
  document.getElementById('outMin').textContent = outMin.toFixed(1);
  document.getElementById('outMax').textContent = outMax.toFixed(1);
  document.getElementById('procTime').textContent = (t1 - t0).toFixed(1) + ' ms';
}

document.getElementById('normalize').addEventListener('change', applyConvolution);

buildKernelGrid();
buildPresets();
applyConvolution();
</script>
</body>
</html>
