<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../shared/theme.css">
<title>PID 쿼드로터 호버 튜닝</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--rp-bg);
  color: var(--rp-text);
  font-family: var(--rp-font-body);
  letter-spacing: -0.016em;
  padding: 20px; min-height: 100vh;
}
h1 {
  font-family: var(--rp-font-display);
  font-size: 26px; font-weight: 600; letter-spacing: -0.014em;
  text-align: center; margin-bottom: 4px;
}
.subtitle { text-align: center; color: var(--rp-text-muted); font-size: 14px; margin-bottom: 18px; }

.layout { display: grid; grid-template-columns: auto 1fr 280px; gap: 16px; max-width: 1280px; margin: 0 auto; }
@media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }

.canvas-col { display: flex; flex-direction: column; gap: 14px; }
.canvas-wrap {
  background: var(--rp-bg-canvas);
  border: 1px solid var(--rp-border);
  border-radius: var(--rp-radius-md);
  padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.canvas-wrap .label {
  font-size: 11px; font-weight: 700;
  color: var(--rp-text-muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
canvas { display: block; background: #fff; border-radius: var(--rp-radius-sm); }

.panel {
  background: var(--rp-bg-panel);
  border: 1px solid var(--rp-border);
  border-radius: var(--rp-radius-md);
  padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.panel h3 {
  font-size: 11px; font-weight: 700;
  color: var(--rp-text-muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--rp-border);
}
.slider-group label { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--rp-text-body); margin-bottom: 4px; }
.slider-group label span { color: var(--rp-accent); font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--rp-font-mono); font-size: 12px; }
.slider-group input[type=range] { width: 100%; accent-color: var(--rp-accent); }

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font-family: inherit;
  background: var(--rp-accent); color: #fff; border: 1px solid transparent;
  padding: 8px 14px; border-radius: var(--rp-radius-md);
  font-size: 13px; font-weight: 500; letter-spacing: -0.012em;
  cursor: pointer; transition: background 0.15s; flex: 1;
}
button:hover { background: #0077ed; }
button.secondary { background: #fff; color: var(--rp-text); border-color: var(--rp-border); }
button.secondary:hover { background: var(--rp-bg-alt); }

.preset-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.preset-row button { padding: 6px 8px; font-size: 12px; }

.stats { font-size: 12.5px; color: var(--rp-text-body); line-height: 1.7; border-top: 1px solid var(--rp-border); padding-top: 10px; }
.stats .row { display: flex; justify-content: space-between; }
.stats .row span:last-child { color: var(--rp-text-heading); font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--rp-font-mono); font-size: 12px; }
.stats .warn span:last-child { color: #ff9500; }

.legend { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--rp-text-body); }
.legend .sw { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 8px; vertical-align: middle; }

.hint { font-size: 12px; color: var(--rp-text-muted); line-height: 1.5; }
</style>
</head>
<body>
<h1>PID 쿼드로터 호버 튜닝</h1>
<p class="subtitle">1D 쿼드로터 고도 제어 — Kp·Ki·Kd 슬라이더로 응답 특성 관찰</p>

<div class="layout">
  <div class="canvas-col">
    <div class="canvas-wrap">
      <div class="label">세계 — 고도 추적</div>
      <canvas id="world" width="300" height="420"></canvas>
    </div>
  </div>

  <div class="canvas-col">
    <div class="canvas-wrap">
      <div class="label">높이 응답</div>
      <canvas id="zPlot" width="680" height="200"></canvas>
    </div>
    <div class="canvas-wrap">
      <div class="label">제어 입력 (추력)</div>
      <canvas id="uPlot" width="680" height="140"></canvas>
    </div>
    <div class="legend">
      <div><span class="sw" style="background:#0071e3"></span>고도 z</div>
      <div><span class="sw" style="background:#ff9500; border-top: 2px dashed #ff9500; height: 0"></span>목표 setpoint</div>
      <div><span class="sw" style="background:#34c759"></span>추력 T (정규화 0~2·mg)</div>
    </div>
  </div>

  <div class="panel">
    <h3>게인</h3>
    <div class="slider-group">
      <label>Kp (비례) <span id="kpVal">6.0</span></label>
      <input type="range" id="kp" min="0" max="30" step="0.1" value="6.0">
    </div>
    <div class="slider-group">
      <label>Ki (적분) <span id="kiVal">1.0</span></label>
      <input type="range" id="ki" min="0" max="10" step="0.05" value="1.0">
    </div>
    <div class="slider-group">
      <label>Kd (미분) <span id="kdVal">3.5</span></label>
      <input type="range" id="kd" min="0" max="10" step="0.05" value="3.5">
    </div>

    <h3>시나리오</h3>
    <div class="slider-group">
      <label>목표 고도 (m) <span id="spVal">3.0</span></label>
      <input type="range" id="sp" min="0.5" max="8" step="0.1" value="3.0">
    </div>
    <div class="slider-group">
      <label>센서 노이즈 σ <span id="nVal">0.02</span></label>
      <input type="range" id="noise" min="0" max="0.2" step="0.005" value="0.02">
    </div>

    <h3>프리셋</h3>
    <div class="preset-row">
      <button class="secondary" data-preset="0,0,0">미튠</button>
      <button class="secondary" data-preset="6,0,0">Kp만</button>
      <button class="secondary" data-preset="3,3,0">진동 PI</button>
      <button class="secondary" data-preset="6,1,3.5">양호</button>
      <button class="secondary" data-preset="20,2,0.5">오버슈트</button>
      <button class="secondary" data-preset="1,0,0.5">느림</button>
    </div>

    <div class="btn-row">
      <button id="nudgeBtn">💥 외력</button>
      <button id="resetBtn" class="secondary">리셋</button>
    </div>

    <div class="stats">
      <div class="row"><span>오버슈트</span><span id="statOver">—</span></div>
      <div class="row"><span>세틀링 시간 (±5%)</span><span id="statSettle">—</span></div>
      <div class="row warn"><span>정상상태 오차</span><span id="statSSE">—</span></div>
      <div class="row"><span>추력 (정규화)</span><span id="statThrust">—</span></div>
    </div>

    <p class="hint">T<sub>cmd</sub> = m·g + K<sub>p</sub>·e + K<sub>i</sub>·∫e + K<sub>d</sub>·ė<br>(anti-windup 포함)</p>
  </div>
</div>

<script>
(function () {
  const world = document.getElementById('world');
  const zPlot = document.getElementById('zPlot');
  const uPlot = document.getElementById('uPlot');
  const ctxW = world.getContext('2d');
  const ctxZ = zPlot.getContext('2d');
  const ctxU = uPlot.getContext('2d');

  // ── Quadrotor physics ──
  const m = 1.0;            // kg
  const g = 9.81;           // m/s²
  const dt = 0.01;          // 100Hz sim
  const SIM_SPEED = 2;      // 2× realtime per frame

  // Thrust limits (multiples of mg)
  const T_MAX = 2.0 * m * g;
  const T_MIN = 0;

  // State
  let z, zd, integral, prevE, t, disturbance;
  let zHistory, uHistory, timeHistory;
  const HIST_N = 1500;

  function reset() {
    z = 0; zd = 0;
    integral = 0;
    prevE = 0;
    t = 0;
    disturbance = 0;
    zHistory = [];
    uHistory = [];
    timeHistory = [];
    updateStats();
    draw();
  }

  // ── PID step ──
  function randn() {
    const u1 = Math.random(), u2 = Math.random();
    return Math.sqrt(-2 * Math.log(u1 + 1e-12)) * Math.cos(2 * Math.PI * u2);
  }

  function stepSim() {
    const Kp = parseFloat(document.getElementById('kp').value);
    const Ki = parseFloat(document.getElementById('ki').value);
    const Kd = parseFloat(document.getElementById('kd').value);
    const sp = parseFloat(document.getElementById('sp').value);
    const nstd = parseFloat(document.getElementById('noise').value);

    // Noisy measurement
    const zMeas = z + nstd * randn();
    const e = sp - zMeas;
    const de = (e - prevE) / dt;

    // PID output (around gravity comp)
    let T = m * g + Kp * e + Ki * integral + Kd * de;

    // Saturation + anti-windup (conditional)
    const Tsat = Math.max(T_MIN, Math.min(T_MAX, T));
    if (Math.abs(T - Tsat) < 1e-6) integral += e * dt;   // only accumulate when unsaturated
    else if (Math.sign(e) !== Math.sign(T - Tsat)) integral += e * dt;
    integral = Math.max(-10, Math.min(10, integral));    // hard clamp

    T = Tsat;
    prevE = e;

    // Dynamics: m z̈ = T - m g + disturbance
    const zdd = (T - m * g + disturbance) / m;
    zd += zdd * dt;
    z  += zd * dt;

    // Ground collision (z >= 0)
    if (z < 0) { z = 0; zd = Math.max(0, zd); }

    t += dt;
    disturbance *= 0.9;   // transient

    zHistory.push(z);
    uHistory.push(T / (m * g));
    timeHistory.push(t);
    if (zHistory.length > HIST_N) { zHistory.shift(); uHistory.shift(); timeHistory.shift(); }

    return { e, T };
  }

  // ── Stats ──
  function updateStats() {
    const sp = parseFloat(document.getElementById('sp').value);
    if (zHistory.length < 10) {
      document.getElementById('statOver').textContent = '—';
      document.getElementById('statSettle').textContent = '—';
      document.getElementById('statSSE').textContent = '—';
      document.getElementById('statThrust').textContent = '—';
      return;
    }
    const zMax = Math.max(...zHistory);
    const over = sp > 0 ? Math.max(0, (zMax - sp) / sp * 100) : 0;
    document.getElementById('statOver').textContent = over.toFixed(1) + ' %';

    // settling time: last time |z - sp| > 5% of sp
    const band = 0.05 * Math.max(sp, 0.5);
    let idx = -1;
    for (let i = zHistory.length - 1; i >= 0; i--) {
      if (Math.abs(zHistory[i] - sp) > band) { idx = i; break; }
    }
    const settle = idx === -1 ? 0 : timeHistory[idx];
    document.getElementById('statSettle').textContent = settle.toFixed(2) + ' s';

    const sse = zHistory[zHistory.length - 1] - sp;
    document.getElementById('statSSE').textContent = sse.toFixed(3) + ' m';

    const thr = uHistory[uHistory.length - 1];
    document.getElementById('statThrust').textContent = thr.toFixed(2) + ' mg';
  }

  // ── Draw: world ──
  function drawWorld() {
    const W = world.width, H = world.height;
    ctxW.clearRect(0, 0, W, H);

    const Z_MIN = 0, Z_MAX = 9;
    const pxPerM = (H - 40) / (Z_MAX - Z_MIN);
    const groundY = H - 20;

    // ground
    ctxW.fillStyle = '#f5f5f7';
    ctxW.fillRect(0, groundY, W, 20);
    ctxW.strokeStyle = 'rgba(0,0,0,0.12)';
    ctxW.beginPath(); ctxW.moveTo(0, groundY); ctxW.lineTo(W, groundY); ctxW.stroke();

    // altitude gridlines
    ctxW.strokeStyle = 'rgba(0,0,0,0.05)';
    ctxW.fillStyle = 'rgba(0,0,0,0.40)';
    ctxW.font = '10px ' + getComputedStyle(document.body).fontFamily;
    ctxW.textAlign = 'right';
    for (let zm = 1; zm <= 8; zm++) {
      const y = groundY - zm * pxPerM;
      ctxW.beginPath(); ctxW.moveTo(30, y); ctxW.lineTo(W, y); ctxW.stroke();
      ctxW.fillText(zm + 'm', 26, y + 3);
    }

    // setpoint
    const sp = parseFloat(document.getElementById('sp').value);
    const ySp = groundY - sp * pxPerM;
    ctxW.strokeStyle = '#ff9500'; ctxW.setLineDash([6, 4]); ctxW.lineWidth = 2;
    ctxW.beginPath(); ctxW.moveTo(40, ySp); ctxW.lineTo(W - 20, ySp); ctxW.stroke();
    ctxW.setLineDash([]);
    ctxW.fillStyle = '#ff9500'; ctxW.textAlign = 'left';
    ctxW.fillText('setpoint', W - 80, ySp - 4);

    // quadrotor
    const y = groundY - Math.max(0, Math.min(Z_MAX, z)) * pxPerM;
    const cx = W / 2;
    ctxW.fillStyle = '#0071e3';
    ctxW.fillRect(cx - 24, y - 3, 48, 6);    // body bar
    // rotors
    ctxW.fillStyle = '#1d1d1f';
    ctxW.fillRect(cx - 34, y - 6, 10, 3);
    ctxW.fillRect(cx + 24, y - 6, 10, 3);
    // thrust indicator (little arrows below)
    const thr = uHistory.length ? uHistory[uHistory.length - 1] : 1;
    const thrLen = thr * 20;
    ctxW.strokeStyle = '#34c759'; ctxW.lineWidth = 2; ctxW.lineCap = 'round';
    ctxW.beginPath();
    ctxW.moveTo(cx - 29, y + 4); ctxW.lineTo(cx - 29, y + 4 + thrLen);
    ctxW.moveTo(cx + 29, y + 4); ctxW.lineTo(cx + 29, y + 4 + thrLen);
    ctxW.stroke();

    // altitude readout
    ctxW.fillStyle = '#1d1d1f';
    ctxW.font = '600 14px ' + getComputedStyle(document.body).fontFamily;
    ctxW.textAlign = 'left';
    ctxW.fillText(z.toFixed(2) + ' m', cx + 40, y + 4);
  }

  // ── Draw: plot ──
  function drawPlot(ctx, data, color, yMin, yMax, refLine) {
    const W = ctx.canvas.width, H = ctx.canvas.height;
    ctx.clearRect(0, 0, W, H);

    // frame
    ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1;
    ctx.strokeRect(40, 10, W - 50, H - 30);

    // x gridlines (time)
    const padL = 40, padR = 10, padT = 10, padB = 20;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.fillStyle = 'rgba(0,0,0,0.48)';
    ctx.font = '10px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'right';

    // y ticks
    for (let i = 0; i <= 4; i++) {
      const y = padT + (plotH * i / 4);
      const v = yMax - (yMax - yMin) * i / 4;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillText(v.toFixed(1), padL - 4, y + 3);
    }

    if (data.length < 2) return;

    // reference line
    if (refLine !== undefined && refLine !== null) {
      const ry = padT + plotH * (1 - (refLine - yMin) / (yMax - yMin));
      ctx.strokeStyle = '#ff9500'; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(padL, ry); ctx.lineTo(W - padR, ry); ctx.stroke();
      ctx.setLineDash([]);
    }

    // data
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    const n = data.length;
    const windowN = Math.min(n, HIST_N);
    const tStart = timeHistory[n - windowN], tEnd = timeHistory[n - 1];
    const tSpan = Math.max(0.1, tEnd - tStart);
    for (let i = n - windowN; i < n; i++) {
      const tt = (timeHistory[i] - tStart) / tSpan;
      const x = padL + tt * plotW;
      const yv = data[i];
      const ynorm = (yv - yMin) / (yMax - yMin);
      const y = padT + plotH * (1 - Math.max(0, Math.min(1, ynorm)));
      if (i === n - windowN) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // x-axis label
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,0.48)';
    ctx.fillText(`t: ${tStart.toFixed(1)}–${tEnd.toFixed(1)} s`, W / 2, H - 5);
  }

  function draw() {
    const sp = parseFloat(document.getElementById('sp').value);
    drawWorld();
    drawPlot(ctxZ, zHistory, '#0071e3', 0, Math.max(9, sp * 1.3), sp);
    drawPlot(ctxU, uHistory, '#34c759', 0, 2.0, 1.0);
  }

  // ── Loop ──
  function loop() {
    for (let i = 0; i < SIM_SPEED; i++) stepSim();
    draw();
    updateStats();
    requestAnimationFrame(loop);
  }

  // ── Inputs ──
  ['kp', 'ki', 'kd', 'sp', 'noise'].forEach(id => {
    const el = document.getElementById(id);
    el.oninput = () => document.getElementById(id + 'Val').textContent = parseFloat(el.value).toFixed(id === 'noise' ? 3 : (id === 'ki' || id === 'kd' ? 2 : 1));
  });

  document.getElementById('nudgeBtn').onclick = () => { disturbance = -8 * m; };
  document.getElementById('resetBtn').onclick = reset;

  document.querySelectorAll('[data-preset]').forEach(b => {
    b.addEventListener('click', () => {
      const [kp, ki, kd] = b.dataset.preset.split(',').map(parseFloat);
      document.getElementById('kp').value = kp; document.getElementById('kpVal').textContent = kp.toFixed(1);
      document.getElementById('ki').value = ki; document.getElementById('kiVal').textContent = ki.toFixed(2);
      document.getElementById('kd').value = kd; document.getElementById('kdVal').textContent = kd.toFixed(2);
      reset();
    });
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
