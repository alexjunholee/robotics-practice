<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../shared/theme.css">
<title>Canny Edge Detection 파라미터 실험</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #ffffff;
  color: #1d1d1f;
  font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', system-ui, sans-serif;
  padding: 20px;
  min-height: 100vh;
}
h1 {
  text-align: center;
  font-size: 1.6em;
  margin-bottom: 6px;
  color: #0071e3;
}
.subtitle {
  text-align: center;
  font-size: 0.95em;
  color: rgba(0,0,0,0.56);
  margin-bottom: 20px;
}
.container {
  max-width: 1100px;
  margin: 0 auto;
}
.controls {
  background: #f5f5f7;
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  align-items: center;
  justify-content: center;
}
.control-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 200px;
}
.control-group label {
  font-size: 0.85em;
  color: rgba(0,0,0,0.48);
}
.control-group .value {
  font-size: 0.9em;
  color: #0071e3;
  font-weight: bold;
}
input[type="range"] {
  width: 100%;
  accent-color: #0071e3;
  cursor: pointer;
}
.canvas-row {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}
.canvas-box {
  text-align: center;
}
.canvas-box h3 {
  margin-bottom: 8px;
  font-size: 1em;
  color: rgba(0,0,0,0.56);
}
canvas {
  border: 1px solid rgba(0,0,0,0.16);
  border-radius: 6px;
  background: rgba(0,0,0,0.80);
}
</style>
</head>
<body>
<div class="container">
  <h1>Canny Edge Detection 파라미터 실험</h1>
  <p class="subtitle">Gaussian Blur, Sobel Gradient, Non-Max Suppression, Hysteresis Thresholding 과정을 실시간으로 확인</p>

  <div class="controls">
    <div class="control-group">
      <label>Threshold 1 (Low): <span class="value" id="t1Val">50</span></label>
      <input type="range" id="threshold1" min="0" max="255" value="50">
    </div>
    <div class="control-group">
      <label>Threshold 2 (High): <span class="value" id="t2Val">150</span></label>
      <input type="range" id="threshold2" min="0" max="255" value="150">
    </div>
    <div class="control-group">
      <label>Gaussian Blur 커널 크기: <span class="value" id="blurVal">3</span></label>
      <input type="range" id="blurSize" min="0" max="3" value="1">
    </div>
  </div>

  <div class="canvas-row">
    <div class="canvas-box">
      <h3>원본 이미지 (Original)</h3>
      <canvas id="originalCanvas" width="400" height="400"></canvas>
    </div>
    <div class="canvas-box">
      <h3>Edge 검출 결과 (Canny Output)</h3>
      <canvas id="edgeCanvas" width="400" height="400"></canvas>
    </div>
  </div>
</div>

<script>
const W = 400, H = 400;
const origCanvas = document.getElementById('originalCanvas');
const edgeCanvas = document.getElementById('edgeCanvas');
const origCtx = origCanvas.getContext('2d');
const edgeCtx = edgeCanvas.getContext('2d');

const blurKernels = [1, 3, 5, 7];

// Draw a synthetic scene
function drawScene() {
  const ctx = origCtx;
  ctx.fillStyle = 'rgba(0,0,0,0.80)';
  ctx.fillRect(0, 0, W, H);

  // Gradient background region
  const grad = ctx.createLinearGradient(0, 0, 200, 200);
  grad.addColorStop(0, 'rgba(0,0,0,0.16)');
  grad.addColorStop(1, 'rgba(0,0,0,0.48)');
  ctx.fillStyle = grad;
  ctx.fillRect(20, 20, 180, 180);

  // Rectangles
  ctx.fillStyle = '#ddd';
  ctx.fillRect(240, 30, 120, 80);
  ctx.fillStyle = 'rgba(0,0,0,0.56)';
  ctx.fillRect(260, 140, 100, 100);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.strokeRect(50, 240, 140, 120);

  // Circles
  ctx.beginPath();
  ctx.arc(320, 310, 60, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.56)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(150, 320, 40, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.56)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Small shapes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(60, 160);
  ctx.lineTo(100, 210);
  ctx.lineTo(20, 210);
  ctx.closePath();
  ctx.fill();

  // Radial gradient circle
  const rg = ctx.createRadialGradient(320, 100, 5, 320, 100, 50);
  rg.addColorStop(0, '#fff');
  rg.addColorStop(1, 'rgba(0,0,0,0.16)');
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.arc(320, 100, 50, 0, Math.PI * 2);
  ctx.fill();

  // Lines
  ctx.strokeStyle = 'rgba(0,0,0,0.48)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(200, 250);
  ctx.lineTo(230, 390);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(20, 390);
  ctx.lineTo(380, 220);
  ctx.stroke();
}

function getGrayscale() {
  const data = origCtx.getImageData(0, 0, W, H).data;
  const gray = new Float64Array(W * H);
  for (let i = 0; i < W * H; i++) {
    gray[i] = 0.299 * data[i*4] + 0.587 * data[i*4+1] + 0.114 * data[i*4+2];
  }
  return gray;
}

function gaussianKernel(size) {
  if (size <= 1) return { k: [1], size: 1 };
  const sigma = size / 3;
  const half = Math.floor(size / 2);
  const k = [];
  let sum = 0;
  for (let i = -half; i <= half; i++) {
    const v = Math.exp(-(i*i) / (2*sigma*sigma));
    k.push(v);
    sum += v;
  }
  for (let i = 0; i < k.length; i++) k[i] /= sum;
  return { k, size };
}

function blur1D(src, w, h, kernel, horizontal) {
  const dst = new Float64Array(w * h);
  const half = Math.floor(kernel.length / 2);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let val = 0;
      for (let k = -half; k <= half; k++) {
        let sx, sy;
        if (horizontal) { sx = Math.min(Math.max(x + k, 0), w - 1); sy = y; }
        else { sx = x; sy = Math.min(Math.max(y + k, 0), h - 1); }
        val += src[sy * w + sx] * kernel[k + half];
      }
      dst[y * w + x] = val;
    }
  }
  return dst;
}

function gaussianBlur(gray, size) {
  if (size <= 1) return gray;
  const { k } = gaussianKernel(size);
  const tmp = blur1D(gray, W, H, k, true);
  return blur1D(tmp, W, H, k, false);
}

function sobelGradient(gray) {
  const gx = new Float64Array(W * H);
  const gy = new Float64Array(W * H);
  const mag = new Float64Array(W * H);
  const dir = new Float64Array(W * H);
  const Kx = [-1, 0, 1, -2, 0, 2, -1, 0, 1];
  const Ky = [-1, -2, -1, 0, 0, 0, 1, 2, 1];
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      let sx = 0, sy = 0;
      let ki = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const v = gray[(y + dy) * W + (x + dx)];
          sx += v * Kx[ki];
          sy += v * Ky[ki];
          ki++;
        }
      }
      const idx = y * W + x;
      gx[idx] = sx;
      gy[idx] = sy;
      mag[idx] = Math.sqrt(sx * sx + sy * sy);
      dir[idx] = Math.atan2(sy, sx);
    }
  }
  // Normalize magnitude to 0-255
  let maxMag = 0;
  for (let i = 0; i < W * H; i++) { if (mag[i] > maxMag) maxMag = mag[i]; }
  if (maxMag > 0) { for (let i = 0; i < W * H; i++) { mag[i] = mag[i] * 255 / maxMag; } }
  return { mag, dir };
}

function nonMaxSuppression(mag, dir) {
  const out = new Float64Array(W * H);
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const idx = y * W + x;
      let angle = dir[idx] * 180 / Math.PI;
      if (angle < 0) angle += 180;
      let n1 = 0, n2 = 0;
      if ((angle < 22.5) || (angle >= 157.5)) {
        n1 = mag[y * W + (x + 1)];
        n2 = mag[y * W + (x - 1)];
      } else if (angle < 67.5) {
        n1 = mag[(y - 1) * W + (x + 1)];
        n2 = mag[(y + 1) * W + (x - 1)];
      } else if (angle < 112.5) {
        n1 = mag[(y - 1) * W + x];
        n2 = mag[(y + 1) * W + x];
      } else {
        n1 = mag[(y - 1) * W + (x - 1)];
        n2 = mag[(y + 1) * W + (x + 1)];
      }
      out[idx] = (mag[idx] >= n1 && mag[idx] >= n2) ? mag[idx] : 0;
    }
  }
  return out;
}

function hysteresis(nms, low, high) {
  const strong = 255, weak = 75;
  const result = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) {
    if (nms[i] >= high) result[i] = strong;
    else if (nms[i] >= low) result[i] = weak;
  }
  // Edge tracking by hysteresis
  let changed = true;
  while (changed) {
    changed = false;
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const idx = y * W + x;
        if (result[idx] === weak) {
          // Check 8-neighbors for strong
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              if (result[(y + dy) * W + (x + dx)] === strong) {
                result[idx] = strong;
                changed = true;
              }
            }
          }
        }
      }
    }
  }
  // Remove remaining weak edges
  for (let i = 0; i < W * H; i++) {
    if (result[i] !== strong) result[i] = 0;
  }
  return result;
}

function runCanny() {
  const t1 = parseInt(document.getElementById('threshold1').value);
  const t2 = parseInt(document.getElementById('threshold2').value);
  const blurIdx = parseInt(document.getElementById('blurSize').value);
  const blurSz = blurKernels[blurIdx];

  document.getElementById('t1Val').textContent = t1;
  document.getElementById('t2Val').textContent = t2;
  document.getElementById('blurVal').textContent = blurSz;

  const low = Math.min(t1, t2);
  const high = Math.max(t1, t2);

  let gray = getGrayscale();
  gray = gaussianBlur(gray, blurSz);
  const { mag, dir } = sobelGradient(gray);
  const nms = nonMaxSuppression(mag, dir);
  const edges = hysteresis(nms, low, high);

  const imgData = edgeCtx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    const v = edges[i];
    imgData.data[i*4] = v;
    imgData.data[i*4+1] = v;
    imgData.data[i*4+2] = v;
    imgData.data[i*4+3] = 255;
  }
  edgeCtx.putImageData(imgData, 0, 0);
}

drawScene();
runCanny();

document.getElementById('threshold1').addEventListener('input', runCanny);
document.getElementById('threshold2').addEventListener('input', runCanny);
document.getElementById('blurSize').addEventListener('input', runCanny);
</script>
</body>
</html>
